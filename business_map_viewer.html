<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business & Language Map</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --ink: #1c1f26;
        --paper: #f7f5f0;
        --line: #d8d3c7;
        --accent: #2c6e49;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        background: var(--paper);
        z-index: 10;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 600;
        white-space: nowrap;
      }
      #dropzone {
        flex: 1;
        min-width: 220px;
        border: 1.5px dashed var(--line);
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        color: #6b6558;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      #dropzone.drag {
        border-color: var(--accent);
        color: var(--accent);
      }
      #stats {
        font-size: 13px;
        color: #6b6558;
        white-space: nowrap;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #sidebar {
        width: 240px;
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 14px;
        font-size: 13px;
        display: none;
      }
      #sidebar.visible {
        display: block;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #6b6558;
        margin: 0 0 10px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        cursor: pointer;
        user-select: none;
      }
      .legend-item.off {
        opacity: 0.35;
      }
      .swatch {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .legend-count {
        margin-left: auto;
        color: #8a8375;
        font-variant-numeric: tabular-nums;
      }
      .leaflet-popup-content b {
        display: block;
        margin-bottom: 2px;
      }
      .leaflet-popup-content a {
        color: var(--accent);
        word-break: break-all;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a8375;
        font-size: 14px;
        pointer-events: none;
      }
      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Business &amp; Language Map</h1>
        <label id="dropzone" for="fileInput"
          >Drop your <code>businesses.json</code> or
          <code>languages.json</code> here, or click to choose a file</label
        >
        <input type="file" id="fileInput" accept="application/json" />
        <div id="stats"></div>
      </header>
      <div id="main">
        <div style="position: relative; flex: 1">
          <div id="map"></div>
          <div id="empty">No data loaded yet</div>
        </div>
        <div id="sidebar"></div>
      </div>
    </div>

    <script>
      const CATEGORY_COLORS = {
        shop: "#c9622a",
        amenity: "#2c6e49",
        office: "#3a5ba0",
        craft: "#9c5fb5",
        tourism: "#c94277",
        leisure: "#2ba7a0",
        healthcare: "#b0392b",
        other: "#6b6558",
      };

      // Dynamic palette for language coloring — assigned on first sight of each
      // language code, so it works for however many distinct languages appear.
      const LANGUAGE_PALETTE = [
        "#c9622a",
        "#2c6e49",
        "#3a5ba0",
        "#9c5fb5",
        "#c94277",
        "#2ba7a0",
        "#b0392b",
        "#d4a72c",
        "#4d7c8a",
        "#7a8a3a",
        "#a05a2c",
        "#5c4d99",
        "#3a8a5c",
        "#b5456e",
        "#2c7ab0",
      ];
      const NO_LANGUAGE_COLOR = "#999999";
      const languageColorMap = new Map();

      function colorForLanguage(key) {
        if (key === "not crawled" || key === "no language detected")
          return NO_LANGUAGE_COLOR;
        if (!languageColorMap.has(key)) {
          languageColorMap.set(
            key,
            LANGUAGE_PALETTE[languageColorMap.size % LANGUAGE_PALETTE.length],
          );
        }
        return languageColorMap.get(key);
      }

      let map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      let markersByCategory = {}; // group key -> array of markers
      let layerGroups = {}; // group key -> L.layerGroup currently on map
      let isLanguageMode = false;

      function topLevelCategory(catString) {
        const key = (catString || "").split("=")[0];
        return CATEGORY_COLORS[key] ? key : "other";
      }

      function groupKeyAndColor(b, languageMode) {
        if (languageMode) {
          let key;
          if (b.cc_status === "found" && b.detected_language)
            key = b.detected_language;
          else if (b.cc_status === "not_found") key = "not crawled";
          else key = "no language detected";
          return { key, color: colorForLanguage(key) };
        }
        const key = topLevelCategory(b.category);
        return { key, color: CATEGORY_COLORS[key] };
      }

      function clearMap() {
        Object.values(layerGroups).forEach((g) => map.removeLayer(g));
        markersByCategory = {};
        layerGroups = {};
        languageColorMap.clear();
      }

      function renderData(businesses) {
        clearMap();
        isLanguageMode = businesses.some((b) => "cc_status" in b);
        document.getElementById("empty").style.display = businesses.length
          ? "none"
          : "flex";

        const bounds = [];
        businesses.forEach((b) => {
          if (typeof b.lat !== "number" || typeof b.lon !== "number") return;
          const { key: groupKey, color } = groupKeyAndColor(b, isLanguageMode);
          if (!markersByCategory[groupKey]) markersByCategory[groupKey] = [];

          const marker = L.circleMarker([b.lat, b.lon], {
            radius: 6,
            color: color,
            weight: 1.5,
            fillColor: color,
            fillOpacity: 0.75,
          });

          const name = b.name ? b.name.replace(/</g, "&lt;") : "(unnamed)";
          const website = b.website || "";
          const safeWebsite = website.replace(/"/g, "&quot;");
          let popupHtml = `<b>${name}</b>`;
          if (isLanguageMode) {
            if (b.cc_status === "found") {
              popupHtml += `Language: ${b.detected_language || "unknown"}`;
              if (typeof b.language_confidence === "number")
                popupHtml += ` (${Math.round(b.language_confidence * 100)}% confidence)`;
              popupHtml += `<br>`;
            } else if (b.cc_status === "not_found") {
              popupHtml += `Not found in Common Crawl<br>`;
            } else {
              popupHtml += `${b.cc_status}<br>`;
            }
          } else if (b.category) {
            popupHtml += `${b.category}<br>`;
          }
          popupHtml += website
            ? `<a href="${safeWebsite}" target="_blank" rel="noopener">${website}</a>`
            : "no website";
          marker.bindPopup(popupHtml);

          markersByCategory[groupKey].push(marker);
          bounds.push([b.lat, b.lon]);
        });

        Object.keys(markersByCategory).forEach((cat) => {
          const group = L.layerGroup(markersByCategory[cat]).addTo(map);
          layerGroups[cat] = group;
        });

        if (bounds.length)
          map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });

        renderSidebar();
        document.getElementById("stats").textContent =
          `${businesses.length} ${isLanguageMode ? "sites" : "businesses"} loaded`;
      }

      function renderSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = `<h2>${isLanguageMode ? "Languages" : "Categories"}</h2>`;
        sidebar.classList.add("visible");

        Object.keys(markersByCategory)
          .sort(
            (a, b) => markersByCategory[b].length - markersByCategory[a].length,
          )
          .forEach((cat) => {
            const swatchColor = isLanguageMode
              ? colorForLanguage(cat)
              : CATEGORY_COLORS[cat];
            const item = document.createElement("div");
            item.className = "legend-item";
            item.innerHTML =
              `<span class="swatch" style="background:${swatchColor}"></span>` +
              `<span>${cat}</span>` +
              `<span class="legend-count">${markersByCategory[cat].length}</span>`;
            item.addEventListener("click", () => {
              const isOn = map.hasLayer(layerGroups[cat]);
              if (isOn) {
                map.removeLayer(layerGroups[cat]);
                item.classList.add("off");
              } else {
                map.addLayer(layerGroups[cat]);
                item.classList.remove("off");
              }
            });
            sidebar.appendChild(item);
          });
      }

      function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error("Expected a JSON array");
            renderData(data);
          } catch (err) {
            alert(
              "Couldn't read that file as a businesses.json export: " +
                err.message,
            );
          }
        };
        reader.readAsText(file);
      }

      const fileInput = document.getElementById("fileInput");
      const dropzone = document.getElementById("dropzone");

      fileInput.addEventListener("change", (e) => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
      });

      ["dragenter", "dragover"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.add("drag");
        }),
      );
      ["dragleave", "drop"].forEach((evt) =>
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.remove("drag");
        }),
      );
      dropzone.addEventListener("drop", (e) => {
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      });
    </script>
  </body>
</html>
