<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinguaMap</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --ink: #1c1f26;
        --paper: #f7f5f0;
        --line: #d8d3c7;
        --muted: #6b6558;
        --accent: #2c6e49;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--paper);
        z-index: 10;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 600;
        white-space: nowrap;
      }
      #stats {
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
        text-align: right;
      }
      .mode-toggle {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .mode-toggle button {
        border: none;
        background: transparent;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink);
      }
      .mode-toggle button.active {
        background: var(--accent);
        color: #fff;
      }
      .area-jump {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .area-jump input,
      .area-jump button {
        font: inherit;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
      }
      .area-jump input {
        width: 130px;
      }
      .area-jump button {
        cursor: pointer;
      }
      #breadcrumb {
        display: none;
        width: 100%;
        flex-basis: 100%;
        font-size: 13px;
        color: var(--muted);
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      #breadcrumb.visible {
        display: flex;
      }
      #breadcrumb button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      #breadcrumb button:disabled {
        color: var(--ink);
        cursor: default;
        font-weight: 600;
      }
      #breadcrumb .sep {
        color: #c4beb0;
      }
      #mapMessage {
        display: none;
        width: 100%;
        flex-basis: 100%;
        font-size: 13px;
        color: #8a3b2b;
        background: #f3e4dc;
        border: 1px solid #e2c4b4;
        border-radius: 6px;
        padding: 8px 10px;
      }
      #mapMessage.visible {
        display: block;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #sidebar {
        width: 268px;
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 14px;
        font-size: 13px;
        flex-shrink: 0;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .legend-section + .legend-section {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .legend-note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
        margin: 0 0 10px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        cursor: pointer;
        user-select: none;
      }
      .legend-item.off {
        opacity: 0.4;
      }
      .legend-item.static {
        cursor: default;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .swatch.ramp {
        width: 26px;
        border-radius: 3px;
        border: 1px solid var(--line);
      }
      .swatch.missing {
        border-radius: 3px;
        background: #c8c2b6;
        border: 1px dashed #8a8375;
      }
      .legend-check {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--line);
        border-radius: 3px;
        flex-shrink: 0;
        background: #fff;
      }
      .legend-item:not(.off) .legend-check {
        background: var(--accent);
        border-color: var(--accent);
      }
      .legend-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-count {
        margin-left: auto;
        color: #8a8375;
        font-variant-numeric: tabular-nums;
        padding-left: 6px;
      }
      .scale-bar {
        height: 10px;
        border-radius: 999px;
        margin: 10px 0 4px;
        border: 1px solid var(--line);
      }
      .scale-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #8a8375;
      }
      .leaflet-popup-content b {
        display: block;
        margin-bottom: 2px;
      }
      .leaflet-popup-content a {
        color: var(--accent);
        word-break: break-all;
      }
      .leaflet-interactive {
        cursor: pointer;
      }
      .area-tip b {
        display: block;
        margin-bottom: 3px;
      }
      .area-tip .row {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
      }
      .area-tip .meta {
        color: #6b6558;
        margin-top: 3px;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 20px;
        pointer-events: none;
      }
      #overlay.hidden {
        display: none;
      }
      @media (max-width: 720px) {
        #main {
          flex-direction: column;
        }
        #sidebar {
          width: 100%;
          border-left: none;
          border-top: 1px solid var(--line);
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>LinguaMap</h1>
        <div class="mode-toggle" role="group" aria-label="Map view">
          <button type="button" id="modeAreas" class="active">Areas</button>
          <button type="button" id="modePoints">Points</button>
        </div>
        <form class="area-jump" id="areaJump">
          <label for="areaName">Jump to</label>
          <input id="areaName" type="text" placeholder="e.g. Wales" autocomplete="off" />
          <button type="submit">Go</button>
        </form>
        <div id="stats"></div>
        <nav id="breadcrumb" aria-label="Area hierarchy"></nav>
        <div id="mapMessage" role="status"></div>
      </header>
      <div id="main">
        <div style="position: relative; flex: 1">
          <div id="map"></div>
          <div id="overlay">Loading datasets…</div>
        </div>
        <div id="sidebar"></div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- config

      const LANGUAGE_COLORS = {
        english: "#2c6ea8",
        french: "#d1495b",
        welsh: "#2c8a4b",
        spanish: "#e0a01e",
        german: "#6a4c93",
        inuktitut: "#2ba7a0",
        cree: "#b5456e",
        ojibwe: "#7a8a3a",
        mikmaq: "#a05a2c",
        mohawk: "#4d7c8a",
        innu: "#9c5fb5",
        dene: "#5c4d99",
        blackfoot: "#3a8a5c",
      };
      const LANGUAGE_PALETTE = [
        "#c9622a",
        "#2c6e49",
        "#3a5ba0",
        "#c94277",
        "#d4a72c",
        "#4d7c8a",
        "#7a8a3a",
        "#5c4d99",
      ];
      const MISSING_FILL = "#c8c2b6";
      const UNCLASSIFIED_COLOR = "#9a948a";
      // Floor on fill intensity so the leading language's hue stays legible even
      // where the race is close; above it, intensity is the real lead margin.
      const LEAD_FLOOR = 0.18;
      const MAX_MARKERS = 12000;

      const paletteAssignments = new Map();

      function colorForLanguage(lang) {
        if (LANGUAGE_COLORS[lang]) return LANGUAGE_COLORS[lang];
        if (!paletteAssignments.has(lang)) {
          paletteAssignments.set(
            lang,
            LANGUAGE_PALETTE[paletteAssignments.size % LANGUAGE_PALETTE.length],
          );
        }
        return paletteAssignments.get(lang);
      }

      function titleCase(s) {
        return s.replace(/(^|\s)\S/g, (c) => c.toUpperCase());
      }

      function pct(fraction) {
        return (fraction * 100).toFixed(1) + "%";
      }

      function ptsLabel(fraction) {
        return (fraction * 100).toFixed(1) + " pts";
      }

      function num(n) {
        return n.toLocaleString();
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function mixToWhite(hex, t) {
        const raw = hex.replace("#", "");
        const r = parseInt(raw.slice(0, 2), 16);
        const g = parseInt(raw.slice(2, 4), 16);
        const b = parseInt(raw.slice(4, 6), 16);
        const clamped = Math.max(0, Math.min(1, t));
        const mix = (c) => Math.round(255 + (c - 255) * clamped);
        return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
      }

      // ------------------------------------------------------- geometry helpers

      function coordsEqual(a, b) {
        return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
      }

      function mergeWaysToRings(ways) {
        const segs = ways.filter((w) => w.length >= 2).map((w) => w.slice());
        const rings = [];
        while (segs.length) {
          const ring = segs.pop();
          let closed = coordsEqual(ring[0], ring[ring.length - 1]);
          let grew = true;
          while (!closed && grew) {
            grew = false;
            for (let i = segs.length - 1; i >= 0; i--) {
              const s = segs[i];
              if (coordsEqual(ring[ring.length - 1], s[0])) ring.push(...s.slice(1));
              else if (coordsEqual(ring[ring.length - 1], s[s.length - 1]))
                ring.push(...s.slice(0, -1).reverse());
              else if (coordsEqual(ring[0], s[s.length - 1])) ring.unshift(...s.slice(0, -1));
              else if (coordsEqual(ring[0], s[0])) ring.unshift(...s.slice(1).reverse());
              else continue;
              segs.splice(i, 1);
              grew = true;
              closed = coordsEqual(ring[0], ring[ring.length - 1]);
              break;
            }
          }
          if (ring.length >= 4) {
            if (!coordsEqual(ring[0], ring[ring.length - 1])) ring.push(ring[0]);
            rings.push(ring);
          }
        }
        return rings;
      }

      function pointInRing(lon, lat, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0],
            yi = ring[i][1];
          const xj = ring[j][0],
            yj = ring[j][1];
          if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      function pointInPolygonCoords(lon, lat, coords) {
        if (!pointInRing(lon, lat, coords[0])) return false;
        for (let i = 1; i < coords.length; i++) {
          if (pointInRing(lon, lat, coords[i])) return false;
        }
        return true;
      }

      function pointInGeometry(lon, lat, geom) {
        if (!geom) return false;
        if (geom.type === "Polygon") return pointInPolygonCoords(lon, lat, geom.coordinates);
        if (geom.type === "MultiPolygon") {
          return geom.coordinates.some((poly) => pointInPolygonCoords(lon, lat, poly));
        }
        return false;
      }

      function geomBBox(geom) {
        let minX = 180,
          minY = 90,
          maxX = -180,
          maxY = -90;
        const walk = (c) => {
          if (typeof c[0] === "number") {
            minX = Math.min(minX, c[0]);
            maxX = Math.max(maxX, c[0]);
            minY = Math.min(minY, c[1]);
            maxY = Math.max(maxY, c[1]);
          } else {
            c.forEach(walk);
          }
        };
        walk(geom.coordinates);
        return [minX, minY, maxX, maxY];
      }

      function relationToGeometry(el) {
        const outers = [];
        const inners = [];
        (el.members || []).forEach((member) => {
          if (!member.geometry || member.geometry.length < 2) return;
          const line = member.geometry.map((p) => [p.lon, p.lat]);
          (member.role === "inner" ? inners : outers).push(line);
        });
        const outerRings = mergeWaysToRings(outers);
        const innerRings = mergeWaysToRings(inners);
        if (!outerRings.length) return null;
        const leftover = innerRings.slice();
        const polygons = outerRings.map((outer) => {
          const holes = leftover.filter((h) => pointInRing(h[0][0], h[0][1], outer));
          holes.forEach((h) => leftover.splice(leftover.indexOf(h), 1));
          return [outer, ...holes];
        });
        return polygons.length === 1
          ? { type: "Polygon", coordinates: polygons[0] }
          : { type: "MultiPolygon", coordinates: polygons };
      }

      function osmToGeoJSON(osm) {
        const features = [];
        (osm.elements || []).forEach((el) => {
          if (el.type !== "relation") return;
          const tags = el.tags || {};
          const geometry = relationToGeometry(el);
          if (!geometry || !tags.name) return;
          features.push({
            type: "Feature",
            properties: {
              name: tags["name:en"] || tags.name || `relation/${el.id}`,
              admin_level: tags.admin_level,
              osm_type: el.type,
              osm_id: el.id,
            },
            geometry,
          });
        });
        return { type: "FeatureCollection", features };
      }

      function featureId(feature) {
        return `${feature.properties.osm_type}/${feature.properties.osm_id}`;
      }

      // ------------------------------------------------------------------ state

      const map = L.map("map", { zoomControl: true, preferCanvas: true }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);
      const markerLayer = L.layerGroup().addTo(map);

      let points = [];
      let datasets = [];
      let viewMode = "areas";

      // User's explicit "off" switches. Everything relevant is on by default, so
      // a language appearing after a drill-down starts visible.
      const disabledLanguages = new Set();
      const disabledCategories = new Set();
      const disabledDatasets = new Set();
      let showUnclassified = false;

      // Recomputed by refreshScope() on every filter/drill change.
      let scopedLanguages = [];
      let activeLanguages = [];
      let activeLanguageSet = new Set();
      let scopedCategories = [];

      let authorityFeatures = [];
      let choroplethLayer = null;
      let hierarchy = [];
      let currentParent = null;
      const authorityCache = new Map();
      // In-flight boundary fetches, so a background warm-up and a click on the
      // same area share one request instead of racing each other.
      const childrenRequests = new Map();
      let admin1Index = null;
      let drillBusy = false;

      // ------------------------------------------------------------ data loading

      function normalizeLanguages(value) {
        if (!Array.isArray(value)) return typeof value === "string" && value ? [value] : [];
        return [...new Set(value.filter((v) => typeof v === "string" && v).map((v) => v.toLowerCase()))];
      }

      function topLevelCategory(catString) {
        return (catString || "").split("=")[0] || "unclassified";
      }

      async function loadDatasets() {
        let manifest;
        try {
          const resp = await fetch("api/datasets");
          if (!resp.ok) throw new Error(String(resp.status));
          manifest = await resp.json();
        } catch (err) {
          setOverlay(
            "Could not reach the dataset index.<br>Start the viewer with <code>python3 serve.py</code>.",
          );
          return;
        }
        if (!manifest.length) {
          setOverlay("No datasets found in <code>data/</code>.");
          return;
        }

        const loaded = await Promise.all(
          manifest.map(async (entry) => {
            const resp = await fetch(entry.url);
            if (!resp.ok) return { ...entry, rows: [] };
            return { ...entry, rows: await resp.json() };
          }),
        );

        points = [];
        datasets = [];
        loaded.forEach((set) => {
          let kept = 0;
          (set.rows || []).forEach((b) => {
            if (typeof b.lat !== "number" || typeof b.lon !== "number") return;
            points.push({
              lat: b.lat,
              lon: b.lon,
              name: b.name || "(unnamed)",
              website: b.website || "",
              category: topLevelCategory(b.category),
              rawCategory: b.category || "",
              langs: normalizeLanguages(b.language),
              dataset: set.name,
              authorityId: null,
              primaryLang: null,
              marker: null,
            });
            kept += 1;
          });
          datasets.push({ name: set.name, count: kept });
        });
        datasets.sort((a, b) => b.count - a.count);
        assignPrimaryLanguages();
      }

      /**
       * A bilingual site is plotted in its rarest language, so minority-language
       * presence is visible instead of being buried under the majority colour.
       */
      function assignPrimaryLanguages() {
        const totals = new Map();
        points.forEach((p) => p.langs.forEach((l) => totals.set(l, (totals.get(l) || 0) + 1)));
        points.forEach((p) => {
          p.primaryLang = p.langs.reduce(
            (rarest, l) => (rarest === null || totals.get(l) < totals.get(rarest) ? l : rarest),
            null,
          );
        });
      }

      // ------------------------------------------------------- filtering & scope

      function datasetEnabled(p) {
        return !disabledDatasets.has(p.dataset);
      }

      /** Points that count toward the current view's language statistics. */
      function inScope(p) {
        if (!datasetEnabled(p)) return false;
        if (disabledCategories.has(p.category)) return false;
        if (viewMode === "areas" && authorityFeatures.length) return p.authorityId !== null;
        return true;
      }

      function isPointVisible(p) {
        if (!datasetEnabled(p) || disabledCategories.has(p.category)) return false;
        if (!p.langs.length) return showUnclassified;
        return p.langs.some((l) => activeLanguageSet.has(l));
      }

      /**
       * Rebuild the language and category lists from whatever is currently in
       * view, so the sidebar only offers choices that mean something here.
       */
      function refreshScope() {
        const langCounts = new Map();
        const catCounts = new Map();
        points.forEach((p) => {
          if (!datasetEnabled(p)) return;
          if (viewMode === "areas" && authorityFeatures.length && p.authorityId === null) return;
          catCounts.set(p.category, (catCounts.get(p.category) || 0) + 1);
          if (disabledCategories.has(p.category)) return;
          p.langs.forEach((l) => langCounts.set(l, (langCounts.get(l) || 0) + 1));
        });
        const byCountThenName = (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]);
        scopedLanguages = [...langCounts.entries()].sort(byCountThenName);
        scopedCategories = [...catCounts.entries()].sort(byCountThenName);
        activeLanguages = scopedLanguages
          .map(([l]) => l)
          .filter((l) => !disabledLanguages.has(l));
        activeLanguageSet = new Set(activeLanguages);
      }

      // -------------------------------------------------------- area statistics

      function assignAuthorities() {
        // Smallest-first so a point inside nested boundaries lands on the tightest.
        const ranked = authorityFeatures
          .map((f) => {
            const bbox = geomBBox(f.geometry);
            return {
              f,
              bbox,
              area: Math.max(0, bbox[2] - bbox[0]) * Math.max(0, bbox[3] - bbox[1]),
            };
          })
          .sort((a, b) => a.area - b.area);
        points.forEach((p) => {
          p.authorityId = null;
          for (const { f, bbox } of ranked) {
            if (p.lon < bbox[0] || p.lon > bbox[2] || p.lat < bbox[1] || p.lat > bbox[3]) {
              continue;
            }
            if (pointInGeometry(p.lon, p.lat, f.geometry)) {
              p.authorityId = featureId(f);
              break;
            }
          }
        });
      }

      /**
       * Per-area language tallies. `classified` counts sites with any detected
       * language, so a single-language share reads as "x% of classified sites".
       */
      let areaStatsCache = null;
      let shareScaleCache = null;

      function authorityStats() {
        if (areaStatsCache) return areaStatsCache;
        const byId = new Map();
        authorityFeatures.forEach((f) => {
          byId.set(featureId(f), {
            feature: f,
            counts: new Map(),
            classified: 0,
            total: 0,
          });
        });
        points.forEach((p) => {
          if (!inScope(p) || !p.authorityId) return;
          const rec = byId.get(p.authorityId);
          if (!rec) return;
          rec.total += 1;
          if (!p.langs.length) return;
          rec.classified += 1;
          p.langs.forEach((l) => rec.counts.set(l, (rec.counts.get(l) || 0) + 1));
        });
        areaStatsCache = byId;
        return byId;
      }

      /**
       * Minority-language shares rarely pass a third of a region, so ramping
       * from 0% to 100% would leave every area near-white. The ramp tops out at
       * the strongest area in view instead, which is what makes the relative
       * pattern readable.
       */
      function singleLanguageScale(lang) {
        if (shareScaleCache !== null) return shareScaleCache;
        let max = 0;
        authorityStats().forEach((rec) => {
          if (!rec.classified) return;
          max = Math.max(max, (rec.counts.get(lang) || 0) / rec.classified);
        });
        shareScaleCache = max || 1;
        return shareScaleCache;
      }

      /**
       * One language selected: intensity is that language's share of classified
       * sites, relative to the strongest area on screen. Two or more: hue is the
       * leading language, intensity is how far ahead it is in relative share
       * among the selected languages.
       */
      function areaFill(rec) {
        if (!rec || !rec.classified || !activeLanguages.length) return null;
        if (activeLanguages.length === 1) {
          const lang = activeLanguages[0];
          const share = (rec.counts.get(lang) || 0) / rec.classified;
          const scale = singleLanguageScale(lang);
          return {
            lang,
            color: colorForLanguage(lang),
            intensity: share / scale,
            share,
            lead: null,
            scale,
          };
        }
        const ranked = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const total = ranked.reduce((sum, [, c]) => sum + c, 0);
        // Classified, but none of the selected languages: white rather than the
        // hatched "no data" fill, since 0% is a real answer.
        if (!total) return { lang: null, color: "#ffffff", intensity: 0, share: 0, lead: 0 };
        const lead = (ranked[0][1] - ranked[1][1]) / total;
        return {
          lang: ranked[0][0],
          color: colorForLanguage(ranked[0][0]),
          intensity: LEAD_FLOOR + (1 - LEAD_FLOOR) * lead,
          share: ranked[0][1] / rec.classified,
          lead,
        };
      }

      function areaTooltip(feature, rec) {
        const name = escapeHtml(feature.properties.name);
        if (!rec || !rec.classified) {
          return `<div class="area-tip"><b>${name}</b><div class="meta">No classified sites here</div></div>`;
        }
        const fill = areaFill(rec);
        const rows = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 6)
          .map(
            ([l, c]) =>
              `<div class="row"><span>${escapeHtml(titleCase(l))}</span><span>${pct(c / rec.classified)}</span></div>`,
          )
          .join("");
        const leadLine =
          fill && fill.lang && fill.lead !== null
            ? `<div class="meta">${escapeHtml(titleCase(fill.lang))} leads by ${ptsLabel(fill.lead)}</div>`
            : "";
        return (
          `<div class="area-tip"><b>${name}</b>${rows}${leadLine}` +
          `<div class="meta">${num(rec.classified)} classified of ${num(rec.total)} sites</div></div>`
        );
      }

      // ------------------------------------------------------------- map drawing

      function clearChoropleth() {
        if (choroplethLayer) {
          map.removeLayer(choroplethLayer);
          choroplethLayer = null;
        }
      }

      function markerFor(p) {
        if (p.marker) return p.marker;
        const color = p.primaryLang ? colorForLanguage(p.primaryLang) : UNCLASSIFIED_COLOR;
        const marker = L.circleMarker([p.lat, p.lon], {
          radius: 5,
          color,
          weight: 1.2,
          fillColor: color,
          fillOpacity: 0.75,
        });
        const langLine = p.langs.length
          ? p.langs.map((l) => escapeHtml(titleCase(l))).join(" + ")
          : "No language detected";
        const href = /^https?:\/\//i.test(p.website) ? p.website : "";
        marker.bindPopup(
          `<b>${escapeHtml(p.name)}</b>${langLine}<br>${escapeHtml(p.rawCategory)}<br>` +
            (href
              ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(href)}</a>`
              : escapeHtml(p.website) || "no website"),
        );
        p.marker = marker;
        return marker;
      }

      function renderPoints() {
        markerLayer.clearLayers();
        const bounds = map.getBounds();
        let shown = 0;
        for (const p of points) {
          if (shown >= MAX_MARKERS) break;
          if (!isPointVisible(p)) continue;
          if (!bounds.contains([p.lat, p.lon])) continue;
          markerLayer.addLayer(markerFor(p));
          shown += 1;
        }
        return shown;
      }

      function renderChoropleth() {
        clearChoropleth();
        if (!authorityFeatures.length) return;
        const stats = authorityStats();
        choroplethLayer = L.geoJSON(
          { type: "FeatureCollection", features: authorityFeatures },
          {
            style(feature) {
              const fill = areaFill(stats.get(featureId(feature)));
              if (!fill) {
                return {
                  color: "#8a8375",
                  weight: 1,
                  dashArray: "4 3",
                  fillColor: MISSING_FILL,
                  fillOpacity: 0.55,
                };
              }
              return {
                color: "#ffffff",
                weight: 1.2,
                fillColor: mixToWhite(fill.color, fill.intensity),
                fillOpacity: 0.9,
              };
            },
            onEachFeature(feature, layer) {
              layer.bindTooltip(areaTooltip(feature, stats.get(featureId(feature))), {
                sticky: true,
              });
              layer.on("click", () => {
                drillInto(feature).catch((err) =>
                  showMapMessage(err.message || `Could not open ${feature.properties.name}.`),
                );
              });
            },
          },
        ).addTo(map);
      }

      function render() {
        areaStatsCache = null;
        shareScaleCache = null;
        refreshScope();
        if (viewMode === "areas") {
          markerLayer.clearLayers();
          renderChoropleth();
        } else {
          clearChoropleth();
          renderPoints();
        }
        renderSidebar();
        renderBreadcrumb();
        updateStats();
      }

      function updateStats() {
        const el = document.getElementById("stats");
        if (!points.length) {
          el.textContent = "";
          return;
        }
        if (viewMode === "areas") {
          const withData = [...authorityStats().values()].filter((r) => r.classified).length;
          const level = hierarchy[hierarchy.length - 1];
          const where = level ? level.name : "world";
          el.textContent = `${num(authorityFeatures.length)} areas in ${where} · ${num(withData)} with language data`;
          return;
        }
        const visible = points.filter(isPointVisible).length;
        const drawn = markerLayer.getLayers().length;
        el.textContent =
          drawn < visible
            ? `${num(drawn)} drawn · ${num(visible)} of ${num(points.length)} sites match — zoom in for the rest`
            : `${num(visible)} of ${num(points.length)} sites match`;
      }

      function setOverlay(html) {
        const el = document.getElementById("overlay");
        if (!html) {
          el.classList.add("hidden");
          return;
        }
        el.innerHTML = html;
        el.classList.remove("hidden");
      }

      function showMapMessage(text) {
        const el = document.getElementById("mapMessage");
        el.textContent = text || "";
        el.classList.toggle("visible", Boolean(text));
      }

      function setProgress(text) {
        document.getElementById("stats").textContent = text;
      }

      // ----------------------------------------------------------------- sidebar

      function legendRow({ swatch, label, count, off, onClick }) {
        const item = document.createElement("div");
        item.className = "legend-item" + (off ? " off" : "") + (onClick ? "" : " static");
        item.innerHTML =
          swatch +
          `<span class="legend-label">${escapeHtml(label)}</span>` +
          (count === undefined ? "" : `<span class="legend-count">${num(count)}</span>`);
        if (onClick) {
          item.setAttribute("role", "button");
          item.addEventListener("click", onClick);
        }
        return item;
      }

      function section(title) {
        const el = document.createElement("div");
        el.className = "legend-section";
        el.innerHTML = `<h2>${title}</h2>`;
        return el;
      }

      function renderLanguageSection() {
        const el = section("Languages");
        if (!scopedLanguages.length) {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.textContent = "No detected languages in this view.";
          el.appendChild(note);
          return el;
        }

        scopedLanguages.forEach(([lang, count]) => {
          const color = colorForLanguage(lang);
          const on = !disabledLanguages.has(lang);
          const swatch =
            viewMode === "areas"
              ? `<span class="swatch ramp" style="background:linear-gradient(to right, ${mixToWhite(color, 0)}, ${color})"></span>`
              : `<span class="swatch" style="background:${color}"></span>`;
          el.appendChild(
            legendRow({
              swatch,
              label: titleCase(lang),
              count,
              off: !on,
              onClick: () => {
                if (on) disabledLanguages.add(lang);
                else disabledLanguages.delete(lang);
                render();
              },
            }),
          );
        });

        if (viewMode === "areas") {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.style.margin = "10px 0 0";
          if (activeLanguages.length === 0) {
            note.textContent = "Select at least one language to colour the map.";
          } else if (activeLanguages.length === 1) {
            note.textContent =
              `Shade is the share of classified sites in ${titleCase(activeLanguages[0])}, ` +
              "scaled to the strongest area in view.";
          } else {
            note.textContent =
              "Hue is the leading language; shade is how far ahead it is. Pale areas are closely contested.";
          }
          el.appendChild(note);

          if (activeLanguages.length === 1) {
            const color = colorForLanguage(activeLanguages[0]);
            const bar = document.createElement("div");
            bar.className = "scale-bar";
            bar.style.background = `linear-gradient(to right, ${mixToWhite(color, 0)}, ${color})`;
            const labels = document.createElement("div");
            labels.className = "scale-labels";
            labels.innerHTML = `<span>0.0%</span><span>${pct(singleLanguageScale(activeLanguages[0]))}</span>`;
            el.appendChild(bar);
            el.appendChild(labels);
          } else if (activeLanguages.length > 1) {
            const bar = document.createElement("div");
            bar.className = "scale-bar";
            bar.style.background = `linear-gradient(to right, ${mixToWhite("#555555", LEAD_FLOOR)}, #555555)`;
            const labels = document.createElement("div");
            labels.className = "scale-labels";
            labels.innerHTML = `<span>tied</span><span>uncontested</span>`;
            el.appendChild(bar);
            el.appendChild(labels);
          }

          el.appendChild(
            legendRow({
              swatch: `<span class="swatch missing"></span>`,
              label: "No classified sites",
            }),
          );
        } else {
          el.appendChild(
            legendRow({
              swatch: `<span class="swatch" style="background:${UNCLASSIFIED_COLOR}"></span>`,
              label: "No language detected",
              off: !showUnclassified,
              onClick: () => {
                showUnclassified = !showUnclassified;
                render();
              },
            }),
          );
        }
        return el;
      }

      function renderSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = "";

        if (viewMode === "areas") {
          const intro = document.createElement("p");
          intro.className = "legend-note";
          intro.textContent = currentParent
            ? `Showing OSM subdivisions of ${currentParent.name}. Click one to drill in.`
            : "Showing every OSM country. Click one with data to drill in.";
          sidebar.appendChild(intro);
        }

        sidebar.appendChild(renderLanguageSection());

        const cats = section("Categories");
        scopedCategories.forEach(([category, count]) => {
          const on = !disabledCategories.has(category);
          cats.appendChild(
            legendRow({
              swatch: `<span class="legend-check"></span>`,
              label: category,
              count,
              off: !on,
              onClick: () => {
                if (on) disabledCategories.add(category);
                else disabledCategories.delete(category);
                render();
              },
            }),
          );
        });
        sidebar.appendChild(cats);

        if (datasets.length > 1) {
          const sets = section("Datasets");
          datasets.forEach(({ name, count }) => {
            const on = !disabledDatasets.has(name);
            sets.appendChild(
              legendRow({
                swatch: `<span class="legend-check"></span>`,
                label: name,
                count,
                off: !on,
                onClick: () => {
                  if (on) disabledDatasets.add(name);
                  else disabledDatasets.delete(name);
                  render();
                },
              }),
            );
          });
          sidebar.appendChild(sets);
        }
      }

      // -------------------------------------------------------- area hierarchy

      function renderBreadcrumb() {
        const nav = document.getElementById("breadcrumb");
        nav.innerHTML = "";
        if (viewMode !== "areas" || !hierarchy.length) {
          nav.classList.remove("visible");
          return;
        }
        nav.classList.add("visible");
        hierarchy.forEach((level, i) => {
          if (i) {
            const sep = document.createElement("span");
            sep.className = "sep";
            sep.textContent = "›";
            nav.appendChild(sep);
          }
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = level.name;
          btn.disabled = i === hierarchy.length - 1;
          btn.addEventListener("click", () => goToLevel(i));
          nav.appendChild(btn);
        });
      }

      function fitToAreas() {
        if (choroplethLayer && choroplethLayer.getBounds().isValid()) {
          map.fitBounds(choroplethLayer.getBounds(), { padding: [20, 20] });
        }
      }

      function goToLevel(index) {
        showMapMessage("");
        hierarchy = hierarchy.slice(0, index + 1);
        const level = hierarchy[index];
        authorityFeatures = level.features;
        currentParent = level.osm_id ? { name: level.name, osm_id: level.osm_id } : null;
        assignAuthorities();
        render();
        if (index === 0) map.setView([20, 0], 2);
        else fitToAreas();
        warmNextLevel();
      }

      function escapeOverpass(value) {
        return String(value)
          .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
          .replace(/"/g, '\\"');
      }

      /**
       * Boundary queries go through serve.py, which caches every response on
       * disk. A cold geometry query can take a couple of minutes; a cached one
       * is instant, so drilling the same area twice costs nothing.
       */
      async function postOverpass(query) {
        try {
          const resp = await fetch("api/overpass", { method: "POST", body: query });
          const data = await resp.json();
          if (!resp.ok) {
            console.warn("Overpass proxy error", data.error);
            return null;
          }
          return data;
        } catch (err) {
          console.warn("Overpass proxy unreachable", err);
          return null;
        }
      }

      function scoreParentRelation(el, query) {
        const tags = el.tags || {};
        const q = query.toLowerCase();
        let score = 0;
        if (tags.boundary === "administrative") score += 20;
        const lvl = parseInt(tags.admin_level || "99", 10);
        if (lvl <= 6) score += 20 - lvl;
        if (tags["ISO3166-1"] || tags["ISO3166-2"]) score += 8;
        if (tags.wikidata) score += 2;
        if (tags.end_date || tags.historic) score -= 40;
        const names = [tags.name, tags["name:en"], tags["name:cy"], tags["name:fr"]]
          .filter(Boolean)
          .map((n) => n.toLowerCase());
        if (names.some((n) => n === q)) score += 10;
        return score;
      }

      async function findParentRelation(name) {
        const q = escapeOverpass(name.trim());
        const data = await postOverpass(`
          [out:json][timeout:30];
          (
            rel["boundary"="administrative"]["name"~"^${q}$",i];
            rel["boundary"="administrative"]["name:en"~"^${q}$",i];
            rel["boundary"="administrative"]["name:cy"~"^${q}$",i];
            rel["boundary"="administrative"]["name:fr"~"^${q}$",i];
            rel["boundary"="administrative"]["name:de"~"^${q}$",i];
          );
          out tags;
        `);
        const rels = ((data && data.elements) || []).filter((el) => el.type === "relation" && el.tags);
        if (!rels.length) return null;
        rels.sort((a, b) => scoreParentRelation(b, name) - scoreParentRelation(a, name));
        const best = rels[0];
        return {
          osm_id: best.id,
          name: best.tags["name:en"] || best.tags.name || name,
          admin_level: best.tags.admin_level,
        };
      }

      async function fetchChildRelationIds(parentId) {
        const data = await postOverpass(`
          [out:json][timeout:30];
          rel(${parentId});
          rel(r)["boundary"="administrative"]["name"];
          out tags;
        `);
        return ((data && data.elements) || [])
          .filter((el) => el.type === "relation" && el.id !== parentId)
          .map((el) => el.id);
      }

      /**
       * Overpass grants a client two query slots, so two chunks in flight is
       * the most that helps; the queue wait dominates, which is why chunks are
       * large.
       */
      const GEOM_CHUNK = 100;
      const GEOM_CONCURRENCY = 2;

      async function fetchRelationsGeom(ids, label, report) {
        const queue = [];
        for (let i = 0; i < ids.length; i += GEOM_CHUNK) {
          queue.push(ids.slice(i, i + GEOM_CHUNK));
        }
        const parts = queue.length;
        const features = [];
        let done = 0;
        const worker = async () => {
          while (queue.length) {
            const chunk = queue.shift();
            report(`Downloading boundaries for ${label} (part ${done + 1} of ${parts})…`);
            const data = await postOverpass(`
              [out:json][timeout:240];
              rel(id:${chunk.join(",")});
              out geom;
            `);
            if (data) features.push(...osmToGeoJSON(data).features);
            done += 1;
          }
        };
        await Promise.all(
          Array.from({ length: Math.min(GEOM_CONCURRENCY, parts) }, worker),
        );
        return features;
      }

      async function fetchChildrenByArea(parentId, adminLevel, label, report) {
        report(`Looking for level-${adminLevel} areas inside ${label}…`);
        const data = await postOverpass(`
          [out:json][timeout:180];
          rel(${parentId});
          map_to_area -> .parent;
          rel(area.parent)["type"="boundary"]["boundary"="administrative"]["admin_level"="${adminLevel}"]["name"];
          out geom;
        `);
        return data ? osmToGeoJSON(data).features : [];
      }

      async function fetchChildrenOfRelation(parent, { quiet = false } = {}) {
        const cacheKey = "children:" + parent.osm_id;
        if (authorityCache.has(cacheKey)) return authorityCache.get(cacheKey);
        if (childrenRequests.has(cacheKey)) return childrenRequests.get(cacheKey);
        const report = quiet ? () => {} : setProgress;
        const job = (async () => {
          report(`Listing subdivisions of ${parent.name}…`);
          const childIds = await fetchChildRelationIds(parent.osm_id);
          let features = childIds.length
            ? await fetchRelationsGeom(childIds, parent.name, report)
            : [];
          if (features.length < 2) {
            const parentLevel = parseInt(parent.admin_level || "4", 10);
            const guess = parentLevel <= 2 ? "4" : parentLevel <= 4 ? "6" : "8";
            const byArea = await fetchChildrenByArea(
              parent.osm_id,
              guess,
              parent.name,
              report,
            );
            if (byArea.length >= 2) features = byArea;
            else {
              const deeper = await fetchChildrenByArea(
                parent.osm_id,
                String(Math.min(10, parseInt(guess, 10) + 2)),
                parent.name,
                report,
              );
              if (deeper.length) features = deeper;
            }
          }
          if (features.length) authorityCache.set(cacheKey, features);
          return features;
        })();
        childrenRequests.set(cacheKey, job);
        try {
          return await job;
        } finally {
          childrenRequests.delete(cacheKey);
        }
      }

      async function loadWorldCountries() {
        if (authorityCache.has("world")) return authorityCache.get("world");
        const resp = await fetch("data/countries.geojson");
        if (!resp.ok) throw new Error("Could not load country outlines.");
        const features = (await resp.json()).features || [];
        if (!features.length) throw new Error("Country outline file is empty.");
        authorityCache.set("world", features);
        return features;
      }

      // ------------------------------------------------- prebuilt first level

      /**
       * fetch_admin1.py bakes every country's states/provinces into
       * data/admin1/, one file per country, with the OSM relation ids needed to
       * keep drilling. Anything covered there loads from disk in milliseconds
       * instead of costing a live Overpass geometry query.
       */
      async function loadAdmin1Index() {
        if (admin1Index) return admin1Index;
        admin1Index = {};
        try {
          const resp = await fetch("data/admin1/index.json");
          if (resp.ok) admin1Index = await resp.json();
          else console.warn("No prebuilt admin1 index; run fetch_admin1.py.");
        } catch (err) {
          console.warn("Could not read prebuilt admin1 index", err);
        }
        return admin1Index;
      }

      /** Prebuilt subdivisions of a country, or null if it is not covered. */
      async function loadPrebuiltChildren(parentOsmId) {
        if (!parentOsmId) return null;
        const cacheKey = "prebuilt:" + parentOsmId;
        if (authorityCache.has(cacheKey)) return authorityCache.get(cacheKey);
        const entry = (await loadAdmin1Index())[String(parentOsmId)];
        if (!entry) return null;
        try {
          const resp = await fetch(entry.url);
          if (!resp.ok) return null;
          const features = (await resp.json()).features || [];
          if (features.length < 2) return null;
          authorityCache.set(cacheKey, features);
          return features;
        } catch (err) {
          console.warn("Could not read prebuilt boundaries", entry.url, err);
          return null;
        }
      }

      /**
       * Prebuilt areas keep their OSM id so the next level still works, but a
       * few hundred worldwide have no id to match; those fall back to a name
       * lookup at the moment they are drilled.
       */
      async function resolveParent(feature) {
        const name = feature.properties.name;
        if (feature.properties.osm_id) {
          return {
            osm_id: feature.properties.osm_id,
            name,
            admin_level: feature.properties.admin_level,
          };
        }
        setProgress(`Finding “${name}” in OpenStreetMap…`);
        return findParentRelation(name);
      }

      async function drillInto(feature) {
        if (drillBusy) return;
        showMapMessage("");
        const name = feature.properties.name;
        const rec = authorityStats().get(featureId(feature));
        if (!rec || !rec.classified) {
          showMapMessage(`${name} has no classified language data in the loaded datasets.`);
          return;
        }
        drillBusy = true;
        try {
          let children = await loadPrebuiltChildren(feature.properties.osm_id);
          let parentId = feature.properties.osm_id;
          if (!children) {
            showMapMessage(
              `Fetching ${name}'s boundaries from OpenStreetMap. This takes a minute or two the first time, then it is cached.`,
            );
            const parent = await resolveParent(feature);
            if (!parent) {
              showMapMessage(`No OSM administrative area matches ${name}.`);
              updateStats();
              return;
            }
            parentId = parent.osm_id;
            children = await fetchChildrenOfRelation(parent);
          }
          if (!children.length) {
            showMapMessage(`${name} has no OSM administrative subdivisions.`);
            updateStats();
            return;
          }
          hierarchy.push({ name, osm_id: parentId, features: children });
          currentParent = { name, osm_id: parentId };
          authorityFeatures = children;
          assignAuthorities();
          showMapMessage("");
          render();
          fitToAreas();
        } finally {
          drillBusy = false;
        }
        warmNextLevel();
      }

      // ---------------------------------------------------- background warm-up

      /**
       * The areas most likely to be clicked next are the ones holding the most
       * data, so their children are fetched before anyone asks. Prebuilt levels
       * cost a local file read; below that we speculate on one live query at a
       * time, and serve.py caches it on disk so the guess also pays off after a
       * reload.
       */
      const WARM_AREAS = 3;
      const WARM_LIVE_QUERIES = 1;
      const warmQueue = [];
      let warming = false;

      function warmNextLevel() {
        if (viewMode !== "areas") return;
        warmQueue.length = 0;
        warmQueue.push(
          ...[...authorityStats().values()]
            .filter((rec) => rec.classified)
            .sort((a, b) => b.classified - a.classified)
            .slice(0, WARM_AREAS)
            .map((rec) => rec.feature),
        );
        drainWarmQueue();
      }

      async function drainWarmQueue() {
        if (warming) return;
        warming = true;
        let liveBudget = WARM_LIVE_QUERIES;
        try {
          while (warmQueue.length) {
            const feature = warmQueue.shift();
            const props = feature.properties;
            if (drillBusy) {
              // A real drill is running; don't compete for Overpass slots.
              warmQueue.unshift(feature);
              await new Promise((resolve) => setTimeout(resolve, 1500));
              continue;
            }
            try {
              if (await loadPrebuiltChildren(props.osm_id)) continue;
              if (!props.osm_id || liveBudget <= 0) continue;
              liveBudget -= 1;
              await fetchChildrenOfRelation(
                { osm_id: props.osm_id, name: props.name, admin_level: props.admin_level },
                { quiet: true },
              );
            } catch (err) {
              console.warn("Boundary warm-up failed for", props.name, err);
            }
          }
        } finally {
          warming = false;
        }
      }

      async function enterAreaMode() {
        if (!hierarchy.length) {
          setProgress("Loading country outlines…");
          const world = await loadWorldCountries();
          hierarchy = [{ name: "World", osm_id: null, features: world }];
          currentParent = null;
          authorityFeatures = world;
          assignAuthorities();
        }
      }

      async function setViewMode(mode) {
        viewMode = mode;
        document.getElementById("modeAreas").classList.toggle("active", mode === "areas");
        document.getElementById("modePoints").classList.toggle("active", mode === "points");
        showMapMessage("");
        if (mode === "areas") {
          try {
            await enterAreaMode();
          } catch (err) {
            showMapMessage(err.message || "Could not load area outlines.");
          }
        }
        render();
        if (mode === "areas") warmNextLevel();
      }

      // ------------------------------------------------------------------ events

      document.getElementById("modeAreas").addEventListener("click", () => setViewMode("areas"));
      document.getElementById("modePoints").addEventListener("click", () => setViewMode("points"));

      document.getElementById("areaJump").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("areaName").value.trim();
        if (!name) return;
        setProgress(`Finding “${name}”…`);
        try {
          const parent = await findParentRelation(name);
          if (!parent) throw new Error(`No OSM administrative area named “${name}”.`);
          let children = await loadPrebuiltChildren(parent.osm_id);
          if (!children) {
            showMapMessage(
              `Fetching boundaries for “${parent.name}” from OpenStreetMap. This takes a minute or two the first time, then it is cached.`,
            );
            children = await fetchChildrenOfRelation(parent);
          }
          if (!children.length) {
            throw new Error(`OSM has no administrative subdivisions for ${parent.name}.`);
          }
          const world = await loadWorldCountries();
          hierarchy = [
            { name: "World", osm_id: null, features: world },
            { name: parent.name, osm_id: parent.osm_id, features: children },
          ];
          currentParent = parent;
          authorityFeatures = children;
          assignAuthorities();
          viewMode = "areas";
          document.getElementById("modeAreas").classList.add("active");
          document.getElementById("modePoints").classList.remove("active");
          showMapMessage("");
          render();
          fitToAreas();
          warmNextLevel();
        } catch (err) {
          showMapMessage(err.message || String(err));
          updateStats();
        }
      });

      map.on("moveend", () => {
        if (viewMode === "points") {
          renderPoints();
          updateStats();
        }
      });
      window.addEventListener("resize", () => map.invalidateSize());

      // -------------------------------------------------------------------- boot

      (async () => {
        loadAdmin1Index(); // in flight before the first click needs it
        await loadDatasets();
        if (!points.length) return;
        setOverlay("");
        await setViewMode("areas");
      })();
    </script>
  </body>
</html>
