        // Keep the locked timeline ramp while scrubbing; rebuild it when we
        // enter/leave time mode or when a non-timed view needs a fresh max.
        if (!timeEnabled || !wasTimed) shareScaleCache = null;
        refreshScope();
        if (viewMode === "areas") {
          markerLayer.clearLayers();
          renderChoropleth();
        } else {
          clearChoropleth();
          renderPoints();
        }
        renderSidebar();
        renderBreadcrumb();
        updateTimeSummary();
      }

      /** Scope changed, so the per-month mix has to be recounted. */
      function invalidateTimeSeries() {
        seriesCache = null;
        areaMonthCache = null;
      }

      function setOverlay(html) {
        const el = document.getElementById("overlay");
        if (!html) {
          el.classList.add("hidden");
          return;
        }
        el.innerHTML = html;
        el.classList.remove("hidden");
      }

      function showMapMessage(text, tone) {
        const el = document.getElementById("mapMessage");
        el.textContent = text || "";
        el.classList.toggle("visible", Boolean(text));
        el.classList.toggle("info", tone === "info");
      }

      // ----------------------------------------------------------------- sidebar

      function legendRow({ swatch, label, count, off, onClick }) {
        const item = document.createElement("div");
        item.className = "legend-item" + (off ? " off" : "") + (onClick ? "" : " static");
        item.innerHTML =
          swatch +
          `<span class="legend-label">${escapeHtml(label)}</span>` +
          (count === undefined ? "" : `<span class="legend-count">${num(count)}</span>`);
        if (onClick) {
          item.setAttribute("role", "button");
          item.addEventListener("click", onClick);
        }
        return item;
      }

      function renderLanguageSection() {
        const el = document.createElement("div");
        el.className = "legend-section";
        if (mapMetric === "multilingual") {
          el.innerHTML =
            "<h2>Multilingual</h2>" +
            '<div class="ramp"></div>' +
            '<div class="ramp-labels"><span>Monolingual</span><span>Multilingual</span></div>';
          return el;
        }
        const heading = document.createElement("div");
        heading.className = "legend-heading";
        heading.innerHTML = "<h2>Languages</h2>";
        if (scopedLanguages.length) {
          const allOn = scopedLanguages.every(([lang]) => !disabledLanguages.has(lang));
          const noneOn = scopedLanguages.every(([lang]) => disabledLanguages.has(lang));
          const actions = document.createElement("div");
          actions.className = "legend-heading-actions";
          const selectAll = document.createElement("button");
          selectAll.type = "button";
          selectAll.textContent = "All";
          selectAll.disabled = allOn;
          selectAll.addEventListener("click", () => {
            disabledLanguages.clear();
            render();
          });
          const deselectAll = document.createElement("button");
          deselectAll.type = "button";
          deselectAll.textContent = "None";
          deselectAll.disabled = noneOn;
          deselectAll.addEventListener("click", () => {
            scopedLanguages.forEach(([lang]) => disabledLanguages.add(lang));
            render();
          });
          actions.appendChild(selectAll);
          actions.appendChild(deselectAll);
          heading.appendChild(actions);
        }
        el.appendChild(heading);
        if (!scopedLanguages.length) {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.textContent = "No languages in this view.";
          el.appendChild(note);
          return el;
        }

        const visible = showAllLanguages
          ? scopedLanguages
          : scopedLanguages.slice(0, TOP_LANGUAGES);
        visible.forEach(([lang, count]) => {
          const color = colorForLanguage(lang);
          const on = !disabledLanguages.has(lang);
          const swatch = `<span class="swatch" style="background:${color}"></span>`;
          el.appendChild(
            legendRow({
              swatch,
              label: titleCase(lang),
              count,
              off: !on,
              onClick: () => {
                if (on) disabledLanguages.add(lang);
                else disabledLanguages.delete(lang);
                render();
              },
            }),
          );
        });
        if (scopedLanguages.length > TOP_LANGUAGES) {
          const more = document.createElement("button");
          more.type = "button";
          more.className = "lang-more";
          more.textContent = showAllLanguages
            ? "Top languages"
            : `All languages · ${scopedLanguages.length}`;
          more.addEventListener("click", () => {
            showAllLanguages = !showAllLanguages;
            renderSidebar();
          });
          el.appendChild(more);
        }
        if (activeLanguages.length === 0) {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.style.margin = "10px 0 0";
          note.textContent = "Select a language to colour the map.";
          el.appendChild(note);
        }
        return el;
      }

      function renderAreaNav() {
        const wrap = document.createElement("div");
        wrap.className = "legend-section";
        const kind = viewingKind();
        const title = currentParent
          ? `${KIND_LABEL[kind]} · ${currentParent.name}`
          : "Places";
        wrap.innerHTML = `<h2>${escapeHtml(title)}</h2>`;
        const stats = authorityStats();
        const q = listFilter.trim().toLowerCase();
        let rows = [...stats.values()];
        if (q) {
          rows = rows.filter((rec) =>
            rec.feature.properties.name.toLowerCase().includes(q),
          );
        }
        rows.sort((a, b) => {
          if (mapMetric === "multilingual") {
            const sa = a.classified ? a.multilingual / a.classified : -1;
            const sb = b.classified ? b.multilingual / b.classified : -1;
            return sb - sa || b.total - a.total || a.feature.properties.name.localeCompare(b.feature.properties.name);
          }
          return b.total - a.total || a.feature.properties.name.localeCompare(b.feature.properties.name);
        });
        const list = document.createElement("div");
        list.className = "area-list";
        if (!rows.length) {
          const empty = document.createElement("p");
          empty.className = "legend-note";
          empty.textContent = q ? "No matching places." : "No places in view.";
          wrap.appendChild(empty);
          return wrap;
        }
        rows.forEach((rec) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const fill = areaFill(rec);
          const color = fill
            ? mapMetric === "multilingual" || fill.lang == null
              ? fill.color
              : mixToLand(fill.color, Math.max(0.22, fill.intensity))
            : MISSING_FILL;
          const count =
            mapMetric === "multilingual"
              ? rec.classified
                ? `${Math.round((rec.multilingual / rec.classified) * 100)}%`
                : "—"
              : num(rec.total);
          btn.innerHTML =
            `<span class="dot" style="background:${color}"></span>` +
            `<span class="legend-label">${escapeHtml(rec.feature.properties.name)}</span>` +
            `<span class="count">${count}</span>`;
          btn.addEventListener("click", () => {
            if (kind === "subdivision_2") {
              focusFeature(rec.feature);
              return;
            }
            drillInto(rec.feature).catch((err) =>
              showMapMessage(err.message || `Could not open ${rec.feature.properties.name}.`),
            );
          });
          list.appendChild(btn);
        });
        wrap.appendChild(list);
        return wrap;
      }

      function renderSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = "";

        if (viewMode === "areas") {
          sidebar.appendChild(renderAreaNav());
        }

        sidebar.appendChild(renderLanguageSection());
      }

      // -------------------------------------------------------- area hierarchy

      function renderBreadcrumb() {
        const nav = document.getElementById("breadcrumb");
        nav.innerHTML = "";
        if (viewMode !== "areas" || hierarchy.length <= 1) {
          nav.classList.remove("visible");
          return;
        }
        nav.classList.add("visible");
        hierarchy.forEach((level, i) => {
          if (i) {
            const sep = document.createElement("span");
            sep.className = "sep";
            sep.textContent = "›";
            nav.appendChild(sep);
          }
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = level.name;
          btn.disabled = i === hierarchy.length - 1;
          btn.addEventListener("click", () => goToLevel(i));
          nav.appendChild(btn);
        });
      }

      function fitToAreas() {
        map.invalidateSize();
        const stats = areaStatsCache;
        const preferred = stats
          ? authorityFeatures.filter((f) => (stats.get(featureId(f)) || {}).total)
          : [];
        const source = preferred.length ? preferred : authorityFeatures;
        if (!source.length) return;
        const layer = L.geoJSON({ type: "FeatureCollection", features: source });
        if (layer.getBounds().isValid()) {
          map.fitBounds(layer.getBounds(), {
            paddingTopLeft: [28, 96],
            paddingBottomRight: [panelCollapsed ? 36 : 276, 0],
            maxZoom: 7,
          });
        }
      }

      function goToLevel(index) {
        showMapMessage("");
        hierarchy = hierarchy.slice(0, index + 1);
        const level = hierarchy[index];
        authorityFeatures = level.features;
        currentParent = level.osm_id ? { name: level.name, osm_id: level.osm_id } : null;
        assignAuthorities();
        render();
        if (index === 0) showWorld();
        else fitToAreas();
        warmNextLevel();
      }

      function escapeOverpass(value) {
        return String(value)
          .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
          .replace(/"/g, '\\"');
      }

      /**
       * Boundary queries go through serve.py, which caches every response on
       * disk. A cold geometry query can take a couple of minutes; a cached one
       * is instant, so drilling the same area twice costs nothing.
       */
      async function postOverpass(query) {
        try {
          const resp = await fetch("api/overpass", { method: "POST", body: query });
          const data = await resp.json();
          if (!resp.ok) {
            console.warn("Overpass proxy error", data.error);
            return null;
          }
          return data;
        } catch (err) {
          console.warn("Overpass proxy unreachable", err);
          return null;
        }
      }

      function scoreParentRelation(el, query) {
        const tags = el.tags || {};
        const q = query.toLowerCase();
        let score = 0;
        if (tags.boundary === "administrative") score += 20;
        const lvl = parseInt(tags.admin_level || "99", 10);
        if (lvl <= 6) score += 20 - lvl;
        if (tags["ISO3166-1"] || tags["ISO3166-2"]) score += 8;
        if (tags.wikidata) score += 2;
        if (tags.end_date || tags.historic) score -= 40;
        const names = [tags.name, tags["name:en"], tags["name:cy"], tags["name:fr"]]
          .filter(Boolean)
          .map((n) => n.toLowerCase());
        if (names.some((n) => n === q)) score += 10;
        return score;
      }

      async function findParentRelation(name) {
        try {
          const resp = await fetch("api/search?q=" + encodeURIComponent(name.trim()));
          if (resp.ok) {
            const hits = await resp.json();
            if (hits && hits.length) return hits[0];
          }
        } catch (err) {
          console.warn("Local area search failed", err);
        }
        const q = escapeOverpass(name.trim());
        const data = await postOverpass(`
          [out:json][timeout:30];
          (
            rel["boundary"="administrative"]["name"~"^${q}$",i];
            rel["boundary"="administrative"]["name:en"~"^${q}$",i];
            rel["boundary"="administrative"]["name:cy"~"^${q}$",i];
            rel["boundary"="administrative"]["name:fr"~"^${q}$",i];
            rel["boundary"="administrative"]["name:de"~"^${q}$",i];
          );
          out tags;
        `);
        const rels = ((data && data.elements) || []).filter((el) => el.type === "relation" && el.tags);
        if (!rels.length) return null;
        rels.sort((a, b) => scoreParentRelation(b, name) - scoreParentRelation(a, name));
        const best = rels[0];
        return {
          osm_id: best.id,
          name: best.tags["name:en"] || best.tags.name || name,
          admin_level: best.tags.admin_level,
        };
      }

      function bboxToPolygon(bbox) {
        if (!bbox || bbox.length < 4) return null;
        const [west, south, east, north] = bbox;
        return {
          type: "Polygon",
          coordinates: [[
            [west, south],
            [east, south],
            [east, north],
            [west, north],
            [west, south],
          ]],
        };
      }

      function bboxFeature(hit) {
        const geometry = bboxToPolygon(hit.bbox);
        if (!geometry) return null;
        return {
          type: "Feature",
          properties: {
            osm_type: "relation",
            osm_id: hit.osm_id,
            name: hit.name,
            admin_level: hit.admin_level,
            kind: hit.kind || kindFromLevel(hit.admin_level),
          },
          geometry,
        };
      }

      function focusFeature(feature) {
        if (!feature || !feature.geometry) return;
        const bbox = geomBBox(feature.geometry);
        map.fitBounds(
          [
            [bbox[1], bbox[0]],
            [bbox[3], bbox[2]],
          ],
          { padding: [28, 28], maxZoom: 10 },
        );
      }

      async function fetchChildrenOfRelation(parent, { quiet = false, onPartial = null } = {}) {
        const childKind = childKindOf(parent.kind || kindFromLevel(parent.admin_level));
        if (childKind === "subdivision_2") return [];
        const cacheKey = "children:" + parent.osm_id;
        const cachedHit = authorityCache.get(cacheKey);
        if (cachedHit && cachedHit.length) return cachedHit;
        if (childrenRequests.has(cacheKey)) return childrenRequests.get(cacheKey);
        const report = quiet ? () => {} : (msg) => showMapMessage(msg, "info");
        const job = (async () => {
          report(`Listing ${KIND_LABEL[childKind].toLowerCase()} areas of ${parent.name}…`);
          const resp = await fetch("api/subdivisions?id=" + parent.osm_id);
          if (!resp.ok) throw new Error(`Could not list subdivisions of ${parent.name}.`);
          const payload = await resp.json();
          const members = payload.members || [];
          const features = (payload.features || []).slice();
          const have = new Set(features.map((f) => f.properties && f.properties.osm_id));
          const missing = members.filter((m) => !have.has(m.osm_id));
          if (onPartial && features.length) await onPartial(features.slice());
          if (!members.length) return features;
          const batchSize = 8;
          const batches = [];
          for (let i = 0; i < missing.length; i += batchSize) {
            batches.push(missing.slice(i, i + batchSize));
          }
          let loaded = features.length;
          const workers = Math.min(2, batches.length);
          await Promise.all(
            Array.from({ length: workers }, async (_, worker) => {
              for (let b = worker; b < batches.length; b += workers) {
                const chunk = batches[b];
                report(
                  `Drawing ${KIND_LABEL[childKind].toLowerCase()} of ${parent.name} (${Math.min(loaded + chunk.length, members.length)} of ${members.length})…`,
                );
                const geoResp = await fetch("api/geojson?ids=" + chunk.map((m) => m.osm_id).join(","));
                const part = geoResp.ok ? (await geoResp.json()).features || [] : [];
                features.push(...part);
                loaded += part.length;
                if (onPartial && features.length) await onPartial(features.slice());
              }
            }),
          );
          if (features.length) authorityCache.set(cacheKey, features);
          return features;
        })();
        childrenRequests.set(cacheKey, job);
        try {
          return await job;
        } finally {
          childrenRequests.delete(cacheKey);
        }
      }

      function prefetchChildren(feature) {
        if (viewMode !== "areas" || !feature || viewingKind() === "subdivision_2") return;
        const props = feature.properties || {};
        if (!props.osm_id) return;
        const cacheKey = "children:" + props.osm_id;
        if (authorityCache.get(cacheKey)?.length || childrenRequests.has(cacheKey)) return;
        if (authorityCache.has("prebuilt:" + props.osm_id)) return;
        loadPrebuiltChildren(props.osm_id).catch((err) =>
          console.warn("Prefetch failed for", props.name, err),
        );
      }

      async function loadWorldCountries() {
        if (authorityCache.has("world")) return authorityCache.get("world");
        const resp = await fetch("data/countries.geojson");
        if (!resp.ok) throw new Error("Could not load country outlines.");
        const features = (await resp.json()).features || [];
        if (!features.length) throw new Error("Country outline file is empty.");
        features.forEach((f) => {
          f.properties.kind = "country";
        });
        authorityCache.set("world", features);
        return features;
      }

      async function loadBoundaryIndex() {
        if (!adminIndexPromise) {
          adminIndexPromise = (async () => {
            const merged = {};
            for (const url of ["data/admin1/index.json", "data/admin2/index.json"]) {
              try {
                const resp = await fetch(url);
                if (resp.ok) Object.assign(merged, await resp.json());
                else if (url.includes("admin1")) {
                  console.warn("No prebuilt subdivision 1 index; run fetch_admin1.py.");
                }
              } catch (err) {
                console.warn("Could not read prebuilt index", url, err);
              }
            }
            return merged;
          })();
        }
        return adminIndexPromise;
      }

      async function loadPrebuiltChildren(parentOsmId) {
        if (!parentOsmId) return null;
        const cacheKey = "prebuilt:" + parentOsmId;
        if (authorityCache.has(cacheKey)) {
          const cached = authorityCache.get(cacheKey);
          return cached && cached.length >= 2 ? cached : null;
        }
        const entry = (await loadBoundaryIndex())[String(parentOsmId)];
        if (!entry) {
          authorityCache.set(cacheKey, []);
          return null;
        }
        try {
          const resp = await fetch(entry.url);
          if (!resp.ok) {
            authorityCache.set(cacheKey, []);
            return null;
          }
          const features = (await resp.json()).features || [];
          const isAdmin1 = (entry.url || "").includes("admin1");
          if (features.length < 2) {
            authorityCache.set(cacheKey, []);
            return null;
          }
          const kind = entry.kind || (isAdmin1 ? "subdivision_1" : "subdivision_2");
          features.forEach((f) => {
            f.properties.kind = kind;
          });
          authorityCache.set(cacheKey, features);
          return features;
        } catch (err) {
          console.warn("Could not read prebuilt boundaries", entry.url, err);
          authorityCache.set(cacheKey, []);
          return null;
        }
      }

      async function resolveParent(feature) {
        const name = feature.properties.name;
        if (feature.properties.osm_id) {
          return {
            osm_id: feature.properties.osm_id,
            name,
            admin_level: feature.properties.admin_level,
            kind: feature.properties.kind || kindFromLevel(feature.properties.admin_level),
          };
        }
        showMapMessage(`Finding “${name}”…`, "info");
        return findParentRelation(name);
      }

      async function fetchSelfFeature(hit) {
        try {
          const resp = await fetch("api/geojson?id=" + hit.osm_id);
          if (resp.ok) {
            const features = ((await resp.json()).features || []).filter(Boolean);
            if (features[0]) return features[0];
          }
        } catch (err) {
          console.warn("Could not load outline for", hit.name, err);
        }
        return bboxFeature(hit);
      }

      function yieldPaint() {
        return new Promise((resolve) => requestAnimationFrame(() => resolve()));
      }

      function showAreaLevel({ name, osmId, features, fit = true }) {
        hierarchy.push({ name, osm_id: osmId, features });
        currentParent = osmId ? { name, osm_id: osmId } : null;
        authorityFeatures = features;
        assignAuthorities();
        showMapMessage("");
        render();
        if (fit) fitToAreas();
      }

      async function drillInto(feature) {
        if (viewingKind() === "subdivision_2") {
          focusFeature(feature);
          return;
        }
        if (drillBusy) {
          pendingDrill = feature;
          showMapMessage(`Still opening the previous area. “${feature.properties.name}” is next.`, "info");
          return;
        }
        showMapMessage("");
        const name = feature.properties.name;
        drillBusy = true;
        showMapMessage(`Opening ${name}…`, "info");
        await yieldPaint();
        let pushed = false;
        const parentIdStart = feature.properties.osm_id;
        const paintPartial = async (partial) => {
          if (!partial.length) return;
          if (!pushed) {
            showAreaLevel({ name, osmId: parentIdStart, features: partial });
            pushed = true;
          } else {
            hierarchy[hierarchy.length - 1].features = partial;
            authorityFeatures = partial;
            assignAuthorities();
            render();
          }
          await yieldPaint();
        };
        try {
          let children = await loadPrebuiltChildren(feature.properties.osm_id);
          let parentId = feature.properties.osm_id;
          if (!children) {
            const cached =
              (parentId && authorityCache.get("children:" + parentId)) ||
              (parentId && authorityCache.get("prebuilt:" + parentId));
            if (cached && cached.length) children = cached;
          }
          if (!children || !children.length) {
            showMapMessage("");
            if (viewingKind() === "subdivision_1") focusFeature(feature);
            else showMapMessage(`${name} has no subdivision areas to show.`);
            return;
          }
          showMapMessage("");
          if (!pushed) {
            showAreaLevel({ name, osmId: parentId, features: children });
          } else {
            hierarchy[hierarchy.length - 1].features = children;
            authorityFeatures = children;
            assignAuthorities();
            render();
            fitToAreas();
          }
        } finally {
          drillBusy = false;
          const next = pendingDrill;
          pendingDrill = null;
          if (next && next !== feature) {
            drillInto(next).catch((err) =>
              showMapMessage(err.message || `Could not open ${next.properties.name}.`),
            );
          }
        }
        warmNextLevel();
      }

      function warmNextLevel() {
        if (viewMode !== "areas" || viewingKind() === "subdivision_2") return;
        [...authorityStats().values()]
          .filter((rec) => rec.classified && rec.feature && rec.feature.properties.osm_id)
          .sort((a, b) => b.classified - a.classified)
          .slice(0, 3)
          .forEach((rec) => {
            loadPrebuiltChildren(rec.feature.properties.osm_id).catch(() => {});
          });
      }

      async function enterAreaMode() {
        if (!hierarchy.length) {
          showMapMessage("Loading countries…", "info");
          const world = await loadWorldCountries();
          hierarchy = [{ name: "World", osm_id: null, features: world }];
          currentParent = null;
          authorityFeatures = world;
          assignAuthorities();
          showMapMessage("");
        }
      }

      async function setViewMode(mode) {
        viewMode = "areas";
        invalidateTimeSeries();
        showMapMessage("");
        try {
          await enterAreaMode();
        } catch (err) {
          showMapMessage(err.message || "Could not load area outlines.");
        }
        render();
        if (isWorldView()) showWorld();
        warmNextLevel();
      }

      function hideSearchResults() {
        document.getElementById("searchResults").hidden = true;
        searchActive = -1;
      }

      function renderSearchResults(hits, query) {
        const box = document.getElementById("searchResults");
        searchHits = hits;
        searchActive = hits.length ? 0 : -1;
        box.innerHTML = "";
        if (!hits.length) {
          const empty = document.createElement("div");
          empty.className = "search-empty";
          empty.textContent = query ? `No places match “${query}”.` : "Type a country or subdivision.";
          box.appendChild(empty);
          box.hidden = false;
          return;
        }
        hits.forEach((hit, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "search-hit" + (i === searchActive ? " active" : "");
          const parent = hit.parent_name ? ` · ${hit.parent_name}` : "";
          btn.innerHTML =
            `<span class="name">${escapeHtml(hit.name)}</span>` +
            `<span class="meta">${escapeHtml(hit.kind_label || KIND_LABEL[hit.kind] || "Place")}${escapeHtml(parent)}</span>`;
          btn.addEventListener("mousedown", (e) => e.preventDefault());
          btn.addEventListener("click", () => openSearchHit(hit));
          box.appendChild(btn);
        });
        box.hidden = false;
      }

      function highlightSearch(index) {
        const buttons = document.querySelectorAll("#searchResults .search-hit");
        buttons.forEach((btn) => btn.classList.remove("active"));
        if (index < 0 || index >= buttons.length) return;
        searchActive = index;
        buttons[index].classList.add("active");
        buttons[index].scrollIntoView({ block: "nearest" });
      }

      async function runSearch(query) {
        if (searchAbort) searchAbort.abort();
        searchAbort = new AbortController();
        try {
          const resp = await fetch("api/search?q=" + encodeURIComponent(query), {
            signal: searchAbort.signal,
          });
          if (!resp.ok) return;
          const hits = await resp.json();
          if (document.getElementById("areaName").value.trim() !== query) return;
          renderSearchResults(Array.isArray(hits) ? hits : [], query);
        } catch (err) {
          if (err.name !== "AbortError") console.warn("Search failed", err);
        }
      }

      async function applySearchHit(hit) {
        viewMode = "areas";
        const world = await loadWorldCountries();
        const kind = hit.kind || kindFromLevel(hit.admin_level);
        hierarchy = [{ name: "World", osm_id: null, features: world }];
        currentParent = null;
        authorityFeatures = world;

        const paintInto = async (name, osmId, partial) => {
          if (!partial.length) return;
          if (hierarchy[hierarchy.length - 1].osm_id === osmId) {
            hierarchy[hierarchy.length - 1].features = partial;
          } else {
            hierarchy.push({ name, osm_id: osmId, features: partial });
          }
          currentParent = { name, osm_id: osmId };
          authorityFeatures = partial;
          assignAuthorities();
          render();
          fitToAreas();
          await yieldPaint();
        };

        if (kind === "country") {
          let children = await loadPrebuiltChildren(hit.osm_id);
          if (!children || !children.length) throw new Error(`${hit.name} has no subdivision 1 areas.`);
          hierarchy = [
            { name: "World", osm_id: null, features: world },
            { name: hit.name, osm_id: hit.osm_id, features: children },
          ];
          currentParent = { name: hit.name, osm_id: hit.osm_id };
          authorityFeatures = children;
        } else if (kind === "subdivision_1") {
          let parentId = hit.parent_osm_id;
          let parentName = hit.parent_name;
          if (!parentId && parentName) {
            const country = world.find(
              (f) => (f.properties.name || "").toLowerCase() === parentName.toLowerCase(),
            );
            if (country) {
              parentId = country.properties.osm_id;
              parentName = country.properties.name;
            }
          }
          if (parentId) {
            const countryFeatures = await loadPrebuiltChildren(parentId);
            if (countryFeatures && countryFeatures.length) {
              hierarchy.push({
                name: parentName || "Country",
                osm_id: parentId,
                features: countryFeatures,
              });
            }
          }
          let children = await loadPrebuiltChildren(hit.osm_id);
          if (!children || !children.length) {
            const siblings = hierarchy[hierarchy.length - 1] && hierarchy[hierarchy.length - 1].features;
            const match = (siblings || []).find((f) => f.properties.osm_id === hit.osm_id);
            if (match) {
              currentParent = parentId ? { name: parentName || "Country", osm_id: parentId } : null;
              authorityFeatures = siblings;
              assignAuthorities();
              render();
              focusFeature(match);
              showMapMessage("");
              return;
            }
            throw new Error(`${hit.name} has no subdivision 2 areas.`);
          }
          if (hierarchy[hierarchy.length - 1].osm_id === hit.osm_id) {
            hierarchy[hierarchy.length - 1].features = children;
          } else {
            hierarchy.push({ name: hit.name, osm_id: hit.osm_id, features: children });
          }
          currentParent = { name: hit.name, osm_id: hit.osm_id };
          authorityFeatures = children;
        } else {
          if (hit.parent_osm_id) {
            const siblings = await loadPrebuiltChildren(hit.parent_osm_id);
            if (siblings && siblings.length) {
              hierarchy.push({
                name: hit.parent_name || "Subdivision 1",
                osm_id: hit.parent_osm_id,
                features: siblings,
              });
              currentParent = { name: hit.parent_name || "Subdivision 1", osm_id: hit.parent_osm_id };
              authorityFeatures = siblings;
              assignAuthorities();
              render();
              const match = siblings.find((f) => f.properties.osm_id === hit.osm_id);
              if (match) focusFeature(match);
              showMapMessage("");
              warmNextLevel();
              return;
            }
          }
          const self = await fetchSelfFeature(hit);
          if (!self) throw new Error(`Could not open ${hit.name}.`);
          hierarchy.push({ name: hit.name, osm_id: hit.osm_id, features: [self] });
          currentParent = { name: hit.name, osm_id: hit.osm_id };
          authorityFeatures = [self];
        }

        assignAuthorities();
        showMapMessage("");
        render();
        fitToAreas();
        warmNextLevel();
      }

      async function openSearchHit(hit) {
        hideSearchResults();
        document.getElementById("areaName").value = hit.name;
        showMapMessage(`Opening ${hit.name}…`, "info");
        try {
          await applySearchHit(hit);
        } catch (err) {
          showMapMessage(err.message || String(err));
        }
      }

      const searchInput = document.getElementById("areaName");
      searchInput.addEventListener("input", () => {
        const query = searchInput.value.trim();
        listFilter = query;
        renderSidebar();
        clearTimeout(searchTimer);
        if (query.length < 2) {
          hideSearchResults();
          return;
        }
        searchTimer = setTimeout(() => runSearch(query), 120);
      });
      searchInput.addEventListener("focus", () => {
        if (searchHits.length) renderSearchResults(searchHits, searchInput.value.trim());
      });
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (!searchHits.length) return;
          highlightSearch(Math.min(searchHits.length - 1, searchActive + 1));
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          highlightSearch(Math.max(0, searchActive - 1));
        } else if (e.key === "Escape") {
          hideSearchResults();
        }
      });
      document.addEventListener("click", (e) => {
        if (!document.getElementById("areaJump").contains(e.target)) hideSearchResults();
      });

      document.getElementById("areaJump").addEventListener("submit", async (e) => {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (!query) return;
        if (searchHits[searchActive]) {
          openSearchHit(searchHits[searchActive]);
          return;
        }
        showMapMessage(`Finding “${query}”…`, "info");
        try {
          const resp = await fetch("api/search?q=" + encodeURIComponent(query));
          const hits = resp.ok ? await resp.json() : [];
          if (!hits.length) throw new Error(`No place named “${query}”.`);
          await openSearchHit(hits[0]);
        } catch (err) {
          showMapMessage(err.message || String(err));
        }
      });

      function setMapMetric(metric) {
        mapMetric = metric;
        document.getElementById("metricLead").classList.toggle("active", metric === "lead");
        document.getElementById("metricMulti").classList.toggle("active", metric === "multilingual");
        render();
      }

      document.getElementById("metricLead").addEventListener("click", () => setMapMetric("lead"));
      document.getElementById("metricMulti").addEventListener("click", () => setMapMetric("multilingual"));

      function setPanelCollapsed(on) {
        panelCollapsed = Boolean(on);
        document.getElementById("app").classList.toggle("panel-collapsed", panelCollapsed);
        const btn = document.getElementById("panelToggle");
        btn.setAttribute("aria-expanded", String(!panelCollapsed));
        btn.title = panelCollapsed ? "Show panel" : "Hide panel";
        btn.textContent = panelCollapsed ? "‹" : "›";
      }
      document.getElementById("panelToggle").addEventListener("click", () => {
        setPanelCollapsed(!panelCollapsed);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== searchInput && document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === "Escape") hideHover();
      });

      document.getElementById("playBtn").addEventListener("click", () => {
        setPlaying(!playTimer);
      });

      document.getElementById("timeSlider").addEventListener("input", (e) => {
        setPlaying(false);
        seekStop(Number(e.target.value));
      });

      map.on("movestart", hideHover);
      map.on("moveend", () => {
        if (viewMode === "points") {
          renderPoints();
          updateStats();
        }
      });
      window.addEventListener("resize", scheduleWorldFit);
      new ResizeObserver(scheduleWorldFit).observe(document.getElementById("map"));
      map.whenReady(scheduleWorldFit);

      // -------------------------------------------------------------------- boot

      (async () => {
        loadBoundaryIndex(); // in flight before the first click needs it
        await loadDatasets();
        if (!points.length) return;
        setOverlay("");
        await setViewMode("areas");
      })();
    </script>
  </body>
</html>
