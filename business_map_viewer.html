<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinguaMap</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --ink: #1c1f26;
        --paper: #f7f5f0;
        --line: #d8d3c7;
        --muted: #6b6558;
        --accent: #2c6e49;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--paper);
        z-index: 10;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        font-weight: 600;
        white-space: nowrap;
      }
      #stats {
        font-size: 13px;
        color: var(--muted);
        margin-left: auto;
        text-align: right;
      }
      .mode-toggle {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .mode-toggle button {
        border: none;
        background: transparent;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink);
      }
      .mode-toggle button.active {
        background: var(--accent);
        color: #fff;
      }
      .area-jump {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        flex-shrink: 0;
        position: relative;
      }
      .search-wrap {
        position: relative;
      }
      .area-jump input,
      .area-jump button {
        font: inherit;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 9px;
      }
      .area-jump input {
        width: 240px;
      }
      .area-jump button {
        cursor: pointer;
      }
      .search-results {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: min(360px, 70vw);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(28, 31, 38, 0.12);
        z-index: 30;
        max-height: 320px;
        overflow-y: auto;
        padding: 4px;
      }
      .search-results[hidden] {
        display: none;
      }
      .search-hit {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        border-radius: 6px;
        padding: 7px 9px;
        cursor: pointer;
        font: inherit;
        color: var(--ink);
      }
      .search-hit:hover,
      .search-hit.active {
        background: #eef4ef;
      }
      .search-hit .name {
        font-size: 13px;
        font-weight: 600;
      }
      .search-hit .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .search-empty {
        padding: 10px 9px;
        font-size: 12px;
        color: var(--muted);
      }
      #breadcrumb {
        display: none;
        width: 100%;
        flex-basis: 100%;
        font-size: 13px;
        color: var(--muted);
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      #breadcrumb.visible {
        display: flex;
      }
      #breadcrumb button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      #breadcrumb button:disabled {
        color: var(--ink);
        cursor: default;
        font-weight: 600;
      }
      #breadcrumb .sep {
        color: #c4beb0;
      }
      #mapMessage {
        display: none;
        width: 100%;
        flex-basis: 100%;
        font-size: 13px;
        color: #8a3b2b;
        background: #f3e4dc;
        border: 1px solid #e2c4b4;
        border-radius: 6px;
        padding: 8px 10px;
      }
      #mapMessage.visible {
        display: block;
      }
      #mapMessage.info {
        color: #3d5346;
        background: #e7efe8;
        border-color: #c5d6c8;
      }
      .area-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 280px;
        overflow-y: auto;
        margin: 0 -4px 4px;
      }
      .area-list button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: none;
        background: transparent;
        text-align: left;
        font: inherit;
        color: var(--ink);
        padding: 5px 6px;
        border-radius: 6px;
        cursor: pointer;
      }
      .area-list button:hover {
        background: #ece7dc;
      }
      .area-list .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #c8c2b6;
      }
      .area-list .count {
        margin-left: auto;
        color: #8a8375;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .leaflet-container {
        background: var(--paper);
      }
      #sidebar {
        width: 268px;
        border-left: 1px solid var(--line);
        overflow-y: auto;
        padding: 14px;
        font-size: 13px;
        flex-shrink: 0;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .legend-section + .legend-section {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .legend-note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
        margin: 0 0 10px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        cursor: pointer;
        user-select: none;
      }
      .legend-item.off {
        opacity: 0.4;
      }
      .legend-item.static {
        cursor: default;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      }
      .swatch.missing {
        border-radius: 3px;
        background: #c8c2b6;
        border: 1px dashed #8a8375;
      }
      .legend-check {
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--line);
        border-radius: 3px;
        flex-shrink: 0;
        background: #fff;
      }
      .legend-item:not(.off) .legend-check {
        background: var(--accent);
        border-color: var(--accent);
      }
      .legend-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-count {
        margin-left: auto;
        color: #8a8375;
        font-variant-numeric: tabular-nums;
        padding-left: 6px;
      }
      .scale-bar {
        height: 10px;
        border-radius: 999px;
        margin: 10px 0 4px;
        border: 1px solid var(--line);
      }
      .scale-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #8a8375;
      }
      .leaflet-popup-content b {
        display: block;
        margin-bottom: 2px;
      }
      .leaflet-popup-content a {
        color: var(--accent);
        word-break: break-all;
      }
      .leaflet-interactive {
        cursor: pointer;
      }
      .area-tip b {
        display: block;
        margin-bottom: 3px;
      }
      .area-tip .row {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
      }
      .area-tip .meta {
        color: #6b6558;
        margin-top: 3px;
      }
      #timeline {
        border-top: 1px solid var(--line);
        background: var(--paper);
        padding: 10px 20px 12px;
        display: flex;
        align-items: stretch;
        gap: 16px;
        flex-shrink: 0;
      }
      #timeline.hidden {
        display: none;
      }
      .time-controls {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        width: 150px;
        flex-shrink: 0;
      }
      .time-controls .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #playBtn {
        font: inherit;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        line-height: 1;
        flex-shrink: 0;
      }
      #playBtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #timeLabel {
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #timeSummary {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.35;
      }
      .time-track {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #timeChart {
        width: 100%;
        height: 62px;
        display: block;
        cursor: ew-resize;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #fff;
      }
      #timeSlider {
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
      }
      .time-axis {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #8a8375;
        font-variant-numeric: tabular-nums;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 20px;
        pointer-events: none;
      }
      #overlay.hidden {
        display: none;
      }
      @media (max-width: 720px) {
        #main {
          flex-direction: column;
        }
        #sidebar {
          width: 100%;
          border-left: none;
          border-top: 1px solid var(--line);
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>LinguaMap</h1>
        <div class="mode-toggle" role="group" aria-label="Map view">
          <button type="button" id="modeAreas" class="active">Areas</button>
          <button type="button" id="modePoints">Points</button>
        </div>
        <form class="area-jump" id="areaJump" autocomplete="off">
          <label for="areaName">Search</label>
          <div class="search-wrap">
            <input
              id="areaName"
              type="search"
              placeholder="Country or subdivision"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="searchResults" class="search-results" hidden></div>
          </div>
        </form>
        <div id="stats"></div>
        <nav id="breadcrumb" aria-label="Area hierarchy"></nav>
        <div id="mapMessage" role="status"></div>
      </header>
      <div id="main">
        <div style="position: relative; flex: 1">
          <div id="map"></div>
          <div id="overlay">Loading datasets…</div>
        </div>
        <div id="sidebar"></div>
      </div>
      <div id="timeline" class="hidden">
        <div class="time-controls">
          <div class="row">
            <button type="button" id="playBtn" title="Play through time">▶</button>
            <span id="timeLabel"></span>
          </div>
          <div id="timeSummary"></div>
        </div>
        <div class="time-track">
          <canvas id="timeChart"></canvas>
          <input type="range" id="timeSlider" min="0" max="0" value="0" step="1"
                 aria-label="Time" />
          <div class="time-axis"><span id="timeStart"></span><span id="timeEnd"></span></div>
        </div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- config

      const LANGUAGE_COLORS = {
        // Majors sit on well-spaced hues so neighbouring areas stay distinct.
        english: "#1a66bc",
        french: "#ca2159",
        welsh: "#23953f",
        spanish: "#e47311",
        german: "#472768",
        ukrainian: "#d5a915",
        russian: "#da281b",
        polish: "#da2fb8",
        romanian: "#129185",
        hungarian: "#8b3b18",
        belarusian: "#719130",
        slovak: "#2091b6",
        bulgarian: "#765842",
        greek: "#273268",
        armenian: "#762519",
        yiddish: "#814096",
        "crimean tatar": "#22775b",
        rusyn: "#88633a",
        gagauz: "#584ab5",
        inuktitut: "#278391",
        cree: "#742f3b",
        ojibwe: "#476d2c",
        mikmaq: "#6f4020",
        mohawk: "#4c6876",
        innu: "#753861",
        dene: "#3f485a",
        blackfoot: "#216340",
      };
      const LANGUAGE_PALETTE = [
        "#c45c26",
        "#5c7a0a",
        "#8a4a6b",
        "#2f5d7c",
        "#a67c32",
        "#4b3d73",
        "#1f7a5c",
        "#7a3b2e",
      ];
      const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                           "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const MISSING_FILL = "#c8c2b6";
      const UNCLASSIFIED_COLOR = "#9a948a";
      // Floor on fill intensity so the leading language's hue stays legible even
      // where the race is close; above it, intensity is the real lead margin.
      const LEAD_FLOOR = 0.18;
      const MAX_MARKERS = 12000;

      const paletteAssignments = new Map();

      function colorForLanguage(lang) {
        if (LANGUAGE_COLORS[lang]) return LANGUAGE_COLORS[lang];
        if (!paletteAssignments.has(lang)) {
          paletteAssignments.set(
            lang,
            LANGUAGE_PALETTE[paletteAssignments.size % LANGUAGE_PALETTE.length],
          );
        }
        return paletteAssignments.get(lang);
      }

      function titleCase(s) {
        return s.replace(/(^|\s)\S/g, (c) => c.toUpperCase());
      }

      function pct(fraction) {
        return (fraction * 100).toFixed(1) + "%";
      }

      function ptsLabel(fraction) {
        return (fraction * 100).toFixed(1) + " pts";
      }

      function num(n) {
        return n.toLocaleString();
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function mixToWhite(hex, t) {
        const raw = hex.replace("#", "");
        const r = parseInt(raw.slice(0, 2), 16);
        const g = parseInt(raw.slice(2, 4), 16);
        const b = parseInt(raw.slice(4, 6), 16);
        const clamped = Math.max(0, Math.min(1, t));
        const mix = (c) => Math.round(255 + (c - 255) * clamped);
        return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
      }

      // ------------------------------------------------------- geometry helpers

      function coordsEqual(a, b) {
        return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
      }

      function mergeWaysToRings(ways) {
        const segs = ways.filter((w) => w.length >= 2).map((w) => w.slice());
        const rings = [];
        while (segs.length) {
          const ring = segs.pop();
          let closed = coordsEqual(ring[0], ring[ring.length - 1]);
          let grew = true;
          while (!closed && grew) {
            grew = false;
            for (let i = segs.length - 1; i >= 0; i--) {
              const s = segs[i];
              if (coordsEqual(ring[ring.length - 1], s[0])) ring.push(...s.slice(1));
              else if (coordsEqual(ring[ring.length - 1], s[s.length - 1]))
                ring.push(...s.slice(0, -1).reverse());
              else if (coordsEqual(ring[0], s[s.length - 1])) ring.unshift(...s.slice(0, -1));
              else if (coordsEqual(ring[0], s[0])) ring.unshift(...s.slice(1).reverse());
              else continue;
              segs.splice(i, 1);
              grew = true;
              closed = coordsEqual(ring[0], ring[ring.length - 1]);
              break;
            }
          }
          if (ring.length >= 4) {
            if (!coordsEqual(ring[0], ring[ring.length - 1])) ring.push(ring[0]);
            rings.push(ring);
          }
        }
        return rings;
      }

      function pointInRing(lon, lat, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0],
            yi = ring[i][1];
          const xj = ring[j][0],
            yj = ring[j][1];
          if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      function pointInPolygonCoords(lon, lat, coords) {
        if (!pointInRing(lon, lat, coords[0])) return false;
        for (let i = 1; i < coords.length; i++) {
          if (pointInRing(lon, lat, coords[i])) return false;
        }
        return true;
      }

      function pointInGeometry(lon, lat, geom) {
        if (!geom) return false;
        if (geom.type === "Polygon") return pointInPolygonCoords(lon, lat, geom.coordinates);
        if (geom.type === "MultiPolygon") {
          return geom.coordinates.some((poly) => pointInPolygonCoords(lon, lat, poly));
        }
        return false;
      }

      function geomBBox(geom) {
        let minX = 180,
          minY = 90,
          maxX = -180,
          maxY = -90;
        const walk = (c) => {
          if (typeof c[0] === "number") {
            minX = Math.min(minX, c[0]);
            maxX = Math.max(maxX, c[0]);
            minY = Math.min(minY, c[1]);
            maxY = Math.max(maxY, c[1]);
          } else {
            c.forEach(walk);
          }
        };
        walk(geom.coordinates);
        return [minX, minY, maxX, maxY];
      }

      function bboxWidth(bbox) {
        return bbox[2] - bbox[0];
      }

      function bboxContains(bbox, lon, lat) {
        if (bboxWidth(bbox) > 180) return false;
        return lon >= bbox[0] && lon <= bbox[2] && lat >= bbox[1] && lat <= bbox[3];
      }

      function polygonBBox(poly) {
        let minX = 180,
          minY = 90,
          maxX = -180,
          maxY = -90;
        const ring = poly[0] || [];
        for (const pt of ring) {
          minX = Math.min(minX, pt[0]);
          maxX = Math.max(maxX, pt[0]);
          minY = Math.min(minY, pt[1]);
          maxY = Math.max(maxY, pt[1]);
        }
        return [minX, minY, maxX, maxY];
      }

      function eachPartBBox(geom, fn) {
        const polys =
          geom.type === "Polygon" ? [geom.coordinates] : geom.type === "MultiPolygon" ? geom.coordinates : [];
        for (const poly of polys) {
          const bbox = polygonBBox(poly);
          // A dateline-spanning ring's AABB covers most of the world (Alaska).
          if (bboxWidth(bbox) > 180) continue;
          fn(poly, bbox);
        }
      }

      function simplifyRing(ring, maxPts) {
        if (ring.length <= maxPts) return ring;
        const stride = (ring.length - 1) / (maxPts - 1);
        const out = [];
        for (let i = 0; i < maxPts - 1; i++) out.push(ring[Math.floor(i * stride)]);
        out.push(ring[0]);
        return out;
      }

      function relationToGeometry(el) {
        const outers = [];
        const inners = [];
        (el.members || []).forEach((member) => {
          if (!member.geometry || member.geometry.length < 2) return;
          const line = member.geometry.map((p) => [p.lon, p.lat]);
          (member.role === "inner" ? inners : outers).push(line);
        });
        const outerRings = mergeWaysToRings(outers);
        const innerRings = mergeWaysToRings(inners);
        if (!outerRings.length) return null;
        const leftover = innerRings.slice();
        const polygons = outerRings.map((outer) => {
          const holes = leftover.filter((h) => pointInRing(h[0][0], h[0][1], outer));
          holes.forEach((h) => leftover.splice(leftover.indexOf(h), 1));
          return [simplifyRing(outer, 80), ...holes.map((h) => simplifyRing(h, 24))];
        });
        return polygons.length === 1
          ? { type: "Polygon", coordinates: polygons[0] }
          : { type: "MultiPolygon", coordinates: polygons };
      }

      function osmToGeoJSON(osm) {
        const features = [];
        (osm.elements || []).forEach((el) => {
          if (el.type !== "relation") return;
          const tags = el.tags || {};
          const geometry = relationToGeometry(el);
          if (!geometry || !tags.name) return;
          features.push({
            type: "Feature",
            properties: {
              name: tags["name:en"] || tags.name || `relation/${el.id}`,
              admin_level: tags.admin_level,
              osm_type: el.type,
              osm_id: el.id,
            },
            geometry,
          });
        });
        return { type: "FeatureCollection", features };
      }

      function featureId(feature) {
        return `${feature.properties.osm_type}/${feature.properties.osm_id}`;
      }

      // ------------------------------------------------------------------ state

      // One world copy only: OSM tiles wrap by default, which repeats unmarked
      // maps beside the coloured overlay when you zoom out.
      const WORLD_BOUNDS = L.latLngBounds([-85.06, -180], [85.06, 180]);
      const map = L.map("map", {
        zoomControl: true,
        preferCanvas: true,
        worldCopyJump: false,
        maxBounds: WORLD_BOUNDS,
        maxBoundsViscosity: 1.0,
      }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        noWrap: true,
        bounds: WORLD_BOUNDS,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);
      const markerLayer = L.layerGroup().addTo(map);

      let points = [];
      let datasets = [];
      let viewMode = "areas";

      // User's explicit "off" switches. Everything relevant is on by default, so
      // a language appearing after a drill-down starts visible.
      const disabledLanguages = new Set();
      const disabledCategories = new Set();
      const disabledDatasets = new Set();
      let showUnclassified = false;

      // Recomputed by refreshScope() on every filter/drill change.
      let scopedLanguages = [];
      let activeLanguages = [];
      let activeLanguageSet = new Set();
      let scopedCategories = [];
      let languageTotals = new Map();

      let authorityFeatures = [];
      let choroplethLayer = null;
      let hierarchy = [];
      let currentParent = null;
      const authorityCache = new Map();
      // In-flight boundary fetches, so a background warm-up and a click on the
      // same area share one request instead of racing each other.
      const childrenRequests = new Map();
      let adminIndexPromise = null;
      let drillBusy = false;
      let pendingDrill = null;
      let searchHits = [];
      let searchActive = -1;
      let searchTimer = null;
      let searchAbort = null;

      const KIND_LABEL = {
        country: "Country",
        subdivision_1: "Subdivision 1",
        subdivision_2: "Subdivision 2",
      };

      function kindFromLevel(adminLevel) {
        const level = parseInt(adminLevel || "99", 10);
        if (level <= 2) return "country";
        if (level <= 4) return "subdivision_1";
        return "subdivision_2";
      }

      function viewingKind() {
        if (hierarchy.length <= 1) return "country";
        if (hierarchy.length === 2) return "subdivision_1";
        return "subdivision_2";
      }

      function childKindOf(kind) {
        return kind === "country" ? "subdivision_1" : "subdivision_2";
      }

      // Timeline. Months are ints (year * 12 + month - 1) so the slider, the
      // chart and the interval lookups all share one coordinate.
      let timeEnabled = false;
      let timeLo = 0;
      let timeHi = 0;
      let currentMonth = 0;
      let playTimer = null;
      let seriesCache = null;

      // ------------------------------------------------------------ data loading

      function normalizeLanguages(value) {
        if (!Array.isArray(value)) return typeof value === "string" && value ? [value] : [];
        return [...new Set(value.filter((v) => typeof v === "string" && v).map((v) => v.toLowerCase()))];
      }

      function topLevelCategory(catString) {
        return (catString || "").split("=")[0] || "unclassified";
      }

      async function loadDatasets() {
        let manifest;
        try {
          const resp = await fetch("api/datasets");
          if (!resp.ok) throw new Error(String(resp.status));
          manifest = await resp.json();
        } catch (err) {
          setOverlay(
            "Could not reach the dataset index.<br>Start the viewer with <code>python3 serve.py</code>.",
          );
          return;
        }
        if (!manifest.length) {
          setOverlay("No datasets found in <code>data/</code>.");
          return;
        }

        const loaded = await Promise.all(
          manifest.map(async (entry) => {
            const resp = await fetch(entry.url);
            if (!resp.ok) return { ...entry, rows: [] };
            return { ...entry, rows: await resp.json() };
          }),
        );

        points = [];
        datasets = [];
        loaded.forEach((set) => {
          let kept = 0;
          (set.rows || []).forEach((b) => {
            if (typeof b.lat !== "number" || typeof b.lon !== "number") return;
            points.push({
              lat: b.lat,
              lon: b.lon,
              name: b.name || "(unnamed)",
              website: b.website || "",
              category: topLevelCategory(b.category),
              rawCategory: b.category || "",
              langs: normalizeLanguages(b.language),
              staticLangs: normalizeLanguages(b.language),
              hist: parseHistory(b.lang_history),
              dataset: set.name,
              authorityId: null,
              primaryLang: null,
              marker: null,
            });
            kept += 1;
          });
          datasets.push({ name: set.name, count: kept });
        });
        datasets.sort((a, b) => b.count - a.count);
        assignPrimaryLanguages();
        initTimeline();
      }

      // ------------------------------------------------------------- timeline

      function monthOf(dateStr) {
        const m = /^(\d{4})-(\d{2})/.exec(String(dateStr || ""));
        return m ? Number(m[1]) * 12 + (Number(m[2]) - 1) : null;
      }

      function monthLabel(idx) {
        const y = Math.floor(idx / 12);
        return `${MONTH_NAMES[idx - y * 12]} ${y}`;
      }

      /** wayback_history.py intervals -> month-indexed, ascending. */
      function parseHistory(raw) {
        if (!Array.isArray(raw) || !raw.length) return null;
        const out = [];
        raw.forEach((iv) => {
          const from = monthOf(iv.from);
          if (from === null) return;
          out.push({
            from,
            to: monthOf(iv.to) ?? from,
            primary: typeof iv.primary === "string" ? iv.primary.toLowerCase() : null,
            available: normalizeLanguages(iv.available),
            landingPath: iv.landing_path || "",
          });
        });
        out.sort((a, b) => a.from - b.from);
        return out.length ? out : null;
      }

      /**
       * State of a site in a given month, carrying the last observation forward
       * across gaps. Before its first snapshot a site returns null rather than a
       * guess, so "not observed yet" stays distinct from "no language detected".
       */
      function stateAt(p, month) {
        const h = p.hist;
        if (!h || month < h[0].from) return null;
        let found = h[0];
        for (let i = 1; i < h.length && h[i].from <= month; i++) found = h[i];
        return found;
      }

      /** Push the selected month into the fields the rest of the app reads. */
      function applyTime() {
        if (!timeEnabled) return;
        points.forEach((p) => {
          if (!p.hist) return; // datasets without history stay as loaded
          const st = stateAt(p, currentMonth);
          p.langs = st ? st.available : [];
          p.primaryLang = st ? st.primary : null;
          if (p.marker) {
            const color = p.primaryLang ? colorForLanguage(p.primaryLang) : UNCLASSIFIED_COLOR;
            p.marker.setStyle({ color, fillColor: color });
          }
        });
      }

      function initTimeline() {
        const withHistory = points.filter((p) => p.hist);
        timeEnabled = withHistory.length > 0;
        document.getElementById("timeline").classList.toggle("hidden", !timeEnabled);
        if (!timeEnabled) return;

        let lo = Infinity;
        let hi = -Infinity;
        withHistory.forEach((p) => {
          lo = Math.min(lo, p.hist[0].from);
          hi = Math.max(hi, p.hist[p.hist.length - 1].to);
        });
        timeLo = lo;
        timeHi = Math.max(hi, lo);
        currentMonth = timeHi;

        const slider = document.getElementById("timeSlider");
        slider.min = "0";
        slider.max = String(timeHi - timeLo);
        slider.value = String(currentMonth - timeLo);
        document.getElementById("timeStart").textContent = monthLabel(timeLo);
        document.getElementById("timeEnd").textContent = monthLabel(timeHi);
        applyTime();
      }

      function seek(month) {
        const next = Math.max(timeLo, Math.min(timeHi, month));
        if (next === currentMonth) return;
        currentMonth = next;
        document.getElementById("timeSlider").value = String(currentMonth - timeLo);
        applyTime();
        render();
      }

      /**
       * Share of each primary language per month, over the points currently in
       * scope. Built by walking each site's intervals rather than probing every
       * month, and cached until a filter changes.
       */
      function timeSeries() {
        if (seriesCache) return seriesCache;
        const span = timeHi - timeLo + 1;
        const counts = Array.from({ length: span }, () => new Map());
        const totals = new Array(span).fill(0);
        const overall = new Map();

        points.forEach((p) => {
          if (!p.hist || !datasetEnabled(p) || disabledCategories.has(p.category)) return;
          if (viewMode === "areas" && authorityFeatures.length && p.authorityId === null) return;
          for (let i = 0; i < p.hist.length; i++) {
            const lang = p.hist[i].primary;
            if (!lang) continue;
            const from = Math.max(timeLo, p.hist[i].from);
            const until = i + 1 < p.hist.length ? p.hist[i + 1].from - 1 : timeHi;
            for (let m = from; m <= Math.min(timeHi, until); m++) {
              const slot = counts[m - timeLo];
              slot.set(lang, (slot.get(lang) || 0) + 1);
              totals[m - timeLo] += 1;
              overall.set(lang, (overall.get(lang) || 0) + 1);
            }
          }
        });

        const order = [...overall.entries()]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([lang]) => lang);
        seriesCache = { counts, totals, order, span };
        return seriesCache;
      }

      function drawTimeChart() {
        if (!timeEnabled) return;
        const canvas = document.getElementById("timeChart");
        const ratio = window.devicePixelRatio || 1;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        if (!w || !h) return;
        canvas.width = w * ratio;
        canvas.height = h * ratio;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const { counts, totals, order, span } = timeSeries();
        const colWidth = w / span;

        // Stacked shares, drawn as columns: one bar per month is both simpler
        // and more honest than a smoothed area when coverage is patchy.
        for (let i = 0; i < span; i++) {
          const total = totals[i];
          const x = i * colWidth;
          if (!total) {
            ctx.fillStyle = "#f0ede6";
            ctx.fillRect(x, 0, Math.ceil(colWidth), h);
            continue;
          }
          let y = 0;
          order.forEach((lang) => {
            const c = counts[i].get(lang) || 0;
            if (!c) return;
            const seg = (c / total) * h;
            ctx.fillStyle = colorForLanguage(lang);
            ctx.fillRect(x, y, Math.ceil(colWidth), Math.ceil(seg));
            y += seg;
          });
        }

        const cursorX = (currentMonth - timeLo + 0.5) * colWidth;
        ctx.strokeStyle = "#1c1f26";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cursorX, 0);
        ctx.lineTo(cursorX, h);
        ctx.stroke();

        updateTimeSummary();
      }

      function updateTimeSummary() {
        const { counts, totals, order } = timeSeries();
        const i = currentMonth - timeLo;
        const total = totals[i] || 0;
        document.getElementById("timeLabel").textContent = monthLabel(currentMonth);
        if (!total) {
          document.getElementById("timeSummary").textContent = "No sites observed yet";
          return;
        }
        const top = order
          .map((lang) => [lang, counts[i].get(lang) || 0])
          .filter(([, c]) => c)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 2)
          .map(([lang, c]) => `${titleCase(lang)} ${pct(c / total)}`)
          .join(" · ");
        document.getElementById("timeSummary").textContent = `${num(total)} observed — ${top}`;
      }

      function setPlaying(on) {
        if (playTimer) {
          clearInterval(playTimer);
          playTimer = null;
        }
        document.getElementById("playBtn").textContent = on ? "❚❚" : "▶";
        if (!on) return;
        playTimer = setInterval(() => {
          seek(currentMonth >= timeHi ? timeLo : currentMonth + 1);
        }, 260);
      }

      /**
       * A bilingual site is plotted in its rarest *selected* language, so
       * minority presence stays visible when that language is on, but turning
       * Welsh off does not leave Welsh-coloured dots on an English-only map.
       */
      function assignPrimaryLanguages() {
        languageTotals = new Map();
        points.forEach((p) => p.langs.forEach((l) => languageTotals.set(l, (languageTotals.get(l) || 0) + 1)));
        points.forEach((p) => {
          p.primaryLang = p.langs.reduce(
            (rarest, l) =>
              rarest === null || languageTotals.get(l) < languageTotals.get(rarest) ? l : rarest,
            null,
          );
        });
      }

      /** Rarest language on this site that is currently selected. */
      function displayLang(p) {
        let best = null;
        for (const l of p.langs) {
          if (!activeLanguageSet.has(l)) continue;
          if (
            best === null ||
            (languageTotals.get(l) || 0) < (languageTotals.get(best) || 0) ||
            ((languageTotals.get(l) || 0) === (languageTotals.get(best) || 0) && l < best)
          ) {
            best = l;
          }
        }
        return best;
      }

      // ------------------------------------------------------- filtering & scope

      function datasetEnabled(p) {
        return !disabledDatasets.has(p.dataset);
      }

      /** Points that count toward the current view's language statistics. */
      function inScope(p) {
        if (!datasetEnabled(p)) return false;
        if (disabledCategories.has(p.category)) return false;
        if (viewMode === "areas" && authorityFeatures.length) return p.authorityId !== null;
        return true;
      }

      function isPointVisible(p) {
        if (!datasetEnabled(p) || disabledCategories.has(p.category)) return false;
        if (!p.langs.length) return showUnclassified;
        return displayLang(p) !== null;
      }

      /**
       * Rebuild the language and category lists from whatever is currently in
       * view, so the sidebar only offers choices that mean something here.
       */
      function refreshScope() {
        const langCounts = new Map();
        const catCounts = new Map();
        points.forEach((p) => {
          if (!datasetEnabled(p)) return;
          if (viewMode === "areas" && authorityFeatures.length && p.authorityId === null) return;
          catCounts.set(p.category, (catCounts.get(p.category) || 0) + 1);
          if (disabledCategories.has(p.category)) return;
          p.langs.forEach((l) => langCounts.set(l, (langCounts.get(l) || 0) + 1));
        });
        const byCountThenName = (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]);
        languageTotals = langCounts;
        scopedLanguages = [...langCounts.entries()].sort(byCountThenName);
        scopedCategories = [...catCounts.entries()].sort(byCountThenName);
        activeLanguages = scopedLanguages
          .map(([l]) => l)
          .filter((l) => !disabledLanguages.has(l));
        activeLanguageSet = new Set(activeLanguages);
      }

      // -------------------------------------------------------- area statistics

      function assignAuthorities() {
        points.forEach((p) => {
          p.authorityId = null;
        });
        if (!authorityFeatures.length) {
          invalidateTimeSeries();
          return;
        }
        let west = 180,
          south = 90,
          east = -180,
          north = -90;
        const ranked = authorityFeatures.map((f) => {
          const bbox = geomBBox(f.geometry);
          const wraps = bboxWidth(bbox) > 180;
          if (!wraps) {
            west = Math.min(west, bbox[0]);
            south = Math.min(south, bbox[1]);
            east = Math.max(east, bbox[2]);
            north = Math.max(north, bbox[3]);
          }
          return {
            f,
            bbox,
            wraps,
            id: featureId(f),
            area: wraps ? 0 : Math.max(0, bbox[2] - bbox[0]) * Math.max(0, bbox[3] - bbox[1]),
          };
        });
        ranked.sort((a, b) => b.area - a.area);
        const world = west > east;
        const CELL = 0.5;
        const grid = new Map();
        const cellKey = (lon, lat) => `${Math.floor(lon / CELL)},${Math.floor(lat / CELL)}`;
        const candidates = [];
        points.forEach((p) => {
          if (!world && (p.lon < west || p.lon > east || p.lat < south || p.lat > north)) return;
          candidates.push(p);
          const k = cellKey(p.lon, p.lat);
          const bucket = grid.get(k);
          if (bucket) bucket.push(p);
          else grid.set(k, [p]);
        });
        for (const { f, id } of ranked) {
          eachPartBBox(f.geometry, (poly, bbox) => {
            const minI = Math.floor(bbox[0] / CELL);
            const maxI = Math.floor(bbox[2] / CELL);
            const minJ = Math.floor(bbox[1] / CELL);
            const maxJ = Math.floor(bbox[3] / CELL);
            for (let i = minI; i <= maxI; i++) {
              for (let j = minJ; j <= maxJ; j++) {
                const bucket = grid.get(`${i},${j}`);
                if (!bucket) continue;
                for (const p of bucket) {
                  if (!bboxContains(bbox, p.lon, p.lat)) continue;
                  if (pointInPolygonCoords(p.lon, p.lat, poly)) p.authorityId = id;
                }
              }
            }
          });
        }
        invalidateTimeSeries();
      }

      /**
       * Per-area language tallies. `classified` counts sites with any detected
       * language, so a single-language share reads as "x% of classified sites".
       */
      let areaStatsCache = null;
      let shareScaleCache = null;

      function authorityStats() {
        if (areaStatsCache) return areaStatsCache;
        const byId = new Map();
        authorityFeatures.forEach((f) => {
          byId.set(featureId(f), {
            feature: f,
            counts: new Map(),
            classified: 0,
            total: 0,
          });
        });
        points.forEach((p) => {
          if (!inScope(p) || !p.authorityId) return;
          const rec = byId.get(p.authorityId);
          if (!rec) return;
          rec.total += 1;
          if (!p.langs.length) return;
          rec.classified += 1;
          p.langs.forEach((l) => rec.counts.set(l, (rec.counts.get(l) || 0) + 1));
        });
        areaStatsCache = byId;
        return byId;
      }

      /**
       * Minority-language shares rarely pass a third of a region, so ramping
       * from 0% to 100% would leave every area near-white. The ramp tops out at
       * the strongest area in view instead, which is what makes the relative
       * pattern readable.
       */
      function singleLanguageScale(lang) {
        if (shareScaleCache !== null) return shareScaleCache;
        let max = 0;
        authorityStats().forEach((rec) => {
          if (!rec.classified) return;
          max = Math.max(max, (rec.counts.get(lang) || 0) / rec.classified);
        });
        shareScaleCache = max || 1;
        return shareScaleCache;
      }

      /**
       * One language selected: intensity is that language's share of classified
       * sites, relative to the strongest area on screen. Two or more: hue is the
       * leading language, intensity is how far ahead it is in relative share
       * among the selected languages.
       */
      function areaFill(rec) {
        if (!rec || !rec.classified || !activeLanguages.length) return null;
        if (activeLanguages.length === 1) {
          const lang = activeLanguages[0];
          const share = (rec.counts.get(lang) || 0) / rec.classified;
          const scale = singleLanguageScale(lang);
          return {
            lang,
            color: colorForLanguage(lang),
            intensity: share / scale,
            share,
            lead: null,
            scale,
          };
        }
        const ranked = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const total = ranked.reduce((sum, [, c]) => sum + c, 0);
        // Classified, but none of the selected languages: white rather than the
        // hatched "no data" fill, since 0% is a real answer.
        if (!total) return { lang: null, color: "#ffffff", intensity: 0, share: 0, lead: 0 };
        const lead = (ranked[0][1] - ranked[1][1]) / total;
        return {
          lang: ranked[0][0],
          color: colorForLanguage(ranked[0][0]),
          intensity: LEAD_FLOOR + (1 - LEAD_FLOOR) * lead,
          share: ranked[0][1] / rec.classified,
          lead,
        };
      }

      function areaTooltip(feature, rec) {
        const name = escapeHtml(feature.properties.name);
        if (!rec || !rec.classified) {
          return `<div class="area-tip"><b>${name}</b><div class="meta">No classified sites here</div></div>`;
        }
        const fill = areaFill(rec);
        const rows = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 6)
          .map(
            ([l, c]) =>
              `<div class="row"><span>${escapeHtml(titleCase(l))}</span><span>${pct(c / rec.classified)}</span></div>`,
          )
          .join("");
        const leadLine =
          fill && fill.lang && fill.lead !== null
            ? `<div class="meta">${escapeHtml(titleCase(fill.lang))} leads by ${ptsLabel(fill.lead)}</div>`
            : "";
        return (
          `<div class="area-tip"><b>${name}</b>${rows}${leadLine}` +
          `<div class="meta">${num(rec.classified)} classified of ${num(rec.total)} sites</div></div>`
        );
      }

      // ------------------------------------------------------------- map drawing

      function clearChoropleth() {
        if (choroplethLayer) {
          map.removeLayer(choroplethLayer);
          choroplethLayer = null;
        }
      }

      function markerFor(p) {
        const lang = p.plotLang != null ? p.plotLang : displayLang(p) || p.primaryLang;
        const color = lang ? colorForLanguage(lang) : UNCLASSIFIED_COLOR;
        if (p.marker) {
          p.marker.setStyle({ color, fillColor: color });
          return p.marker;
        }
        const marker = L.circleMarker([p.lat, p.lon], {
          radius: 5,
          color,
          weight: 1.2,
          fillColor: color,
          fillOpacity: 0.75,
        });
        const href = /^https?:\/\//i.test(p.website) ? p.website : "";
        const link = href
          ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(href)}</a>`
          : escapeHtml(p.website) || "no website";
        // Bound as a function so the popup reflects the month currently selected
        // rather than whenever the marker happened to be created.
        marker.bindPopup(() => {
          const langLine = p.langs.length
            ? p.langs.map((l) => escapeHtml(titleCase(l))).join(" + ")
            : "No language detected";
          const history = p.hist
            ? "<br>" +
              p.hist
                .map(
                  (iv) =>
                    `<span style="color:${colorForLanguage(iv.primary)}">■</span> ` +
                    `${monthLabel(iv.from)}–${monthLabel(iv.to)}: ` +
                    `${escapeHtml(titleCase(iv.primary || "unknown"))}` +
                    (iv.landingPath ? ` <span style="color:#8a8375">${escapeHtml(iv.landingPath)}</span>` : ""),
                )
                .join("<br>")
            : "";
          return (
            `<b>${escapeHtml(p.name)}</b>${langLine}${history}<br>` +
            `${escapeHtml(p.rawCategory)}<br>${link}`
          );
        });
        p.marker = marker;
        return marker;
      }

      /**
       * Thin a bucket down to `take` points with an even stride, so what is
       * dropped is spread across the whole bucket instead of chopping off its
       * tail — which, with datasets concatenated in load order, would mean
       * dropping one region entirely.
       */
      function strideSample(bucket, take, out) {
        if (take >= bucket.length) {
          for (const p of bucket) out.push(p);
          return;
        }
        const stride = bucket.length / take;
        for (let i = 0; i < take; i++) out.push(bucket[Math.floor(i * stride)]);
      }

      /**
       * Fit the matching sites into MAX_MARKERS without letting one language
       * crowd out another. Smallest first: a rare language takes its full
       * bucket (it always fits in the even share), leftover slots are split
       * between the majority colours. Walking `points` in load order and
       * stopping at the cap used to drop Wales entirely once Quebec French
       * filled the budget.
       */
      function budgetMarkers(candidates) {
        if (candidates.length <= MAX_MARKERS) return candidates;
        const buckets = new Map();
        for (const p of candidates) {
          const key = p.plotLang || displayLang(p) || "";
          const bucket = buckets.get(key);
          if (bucket) bucket.push(p);
          else buckets.set(key, [p]);
        }
        const ordered = [...buckets.values()].sort((a, b) => a.length - b.length);
        const out = [];
        let left = MAX_MARKERS;
        let remaining = ordered.length;
        for (const bucket of ordered) {
          // max(1, …) so a pile of tiny languages cannot round the share to 0
          // and vanish. Last bucket always receives whatever is left.
          const share = remaining === 1 ? left : Math.max(1, Math.floor(left / remaining));
          const take = Math.min(bucket.length, share, left);
          strideSample(bucket, take, out);
          left -= take;
          remaining -= 1;
        }
        return out;
      }

      /** Majority first so minority dots paint on top instead of vanishing under them. */
      function sortMarkersMajorityUnderneath(markers) {
        const counts = new Map();
        for (const p of markers) {
          const key = p.plotLang || "";
          counts.set(key, (counts.get(key) || 0) + 1);
        }
        markers.sort((a, b) => {
          const ka = a.plotLang || "";
          const kb = b.plotLang || "";
          const d = (counts.get(kb) || 0) - (counts.get(ka) || 0);
          return d || ka.localeCompare(kb);
        });
      }

      function renderPoints() {
        markerLayer.clearLayers();
        const bounds = map.getBounds();
        const candidates = [];
        for (const p of points) {
          if (!datasetEnabled(p) || disabledCategories.has(p.category)) continue;
          const lang = p.langs.length ? displayLang(p) : showUnclassified ? "" : null;
          if (lang === null) continue;
          if (!bounds.contains([p.lat, p.lon])) continue;
          p.plotLang = lang;
          candidates.push(p);
        }
        const drawn = budgetMarkers(candidates);
        sortMarkersMajorityUnderneath(drawn);
        for (const p of drawn) markerLayer.addLayer(markerFor(p));
        return drawn.length;
      }

      function renderChoropleth() {
        clearChoropleth();
        if (!authorityFeatures.length) return;
        const stats = authorityStats();
        choroplethLayer = L.geoJSON(
          { type: "FeatureCollection", features: authorityFeatures },
          {
            style(feature) {
              const fill = areaFill(stats.get(featureId(feature)));
              if (!fill) {
                return {
                  color: "#8a8375",
                  weight: 1,
                  dashArray: "4 3",
                  fillColor: MISSING_FILL,
                  fillOpacity: 0.55,
                };
              }
              return {
                color: "#ffffff",
                weight: 1.2,
                fillColor: mixToWhite(fill.color, fill.intensity),
                fillOpacity: 0.9,
              };
            },
            onEachFeature(feature, layer) {
              layer.bindTooltip(areaTooltip(feature, stats.get(featureId(feature))), {
                sticky: true,
              });
              layer.on("click", () => {
                if (viewingKind() === "subdivision_2") {
                  focusFeature(feature);
                  return;
                }
                drillInto(feature).catch((err) =>
                  showMapMessage(err.message || `Could not open ${feature.properties.name}.`),
                );
              });
              layer.on("mouseover", () => prefetchChildren(feature));
            },
          },
        ).addTo(map);
      }

      function render() {
        areaStatsCache = null;
        shareScaleCache = null;
        refreshScope();
        if (viewMode === "areas") {
          markerLayer.clearLayers();
          renderChoropleth();
        } else {
          clearChoropleth();
          renderPoints();
        }
        renderSidebar();
        renderBreadcrumb();
        updateStats();
        drawTimeChart();
      }

      /** Scope changed, so the per-month mix has to be recounted. */
      function invalidateTimeSeries() {
        seriesCache = null;
      }

      function updateStats() {
        const el = document.getElementById("stats");
        if (!points.length) {
          el.textContent = "";
          return;
        }
        if (viewMode === "areas") {
          const withData = [...authorityStats().values()].filter((r) => r.classified).length;
          const level = hierarchy[hierarchy.length - 1];
          const where = level ? level.name : "world";
          el.textContent = `${num(authorityFeatures.length)} ${KIND_LABEL[viewingKind()].toLowerCase()} areas in ${where} · ${num(withData)} with language data`;
          return;
        }
        const visible = points.filter(isPointVisible).length;
        const drawn = markerLayer.getLayers().length;
        el.textContent =
          drawn < visible
            ? `${num(drawn)} drawn · ${num(visible)} of ${num(points.length)} sites match — zoom in for the rest`
            : `${num(visible)} of ${num(points.length)} sites match`;
      }

      function setOverlay(html) {
        const el = document.getElementById("overlay");
        if (!html) {
          el.classList.add("hidden");
          return;
        }
        el.innerHTML = html;
        el.classList.remove("hidden");
      }

      function showMapMessage(text, tone) {
        const el = document.getElementById("mapMessage");
        el.textContent = text || "";
        el.classList.toggle("visible", Boolean(text));
        el.classList.toggle("info", tone === "info");
      }

      function setProgress(text) {
        document.getElementById("stats").textContent = text;
      }

      // ----------------------------------------------------------------- sidebar

      function legendRow({ swatch, label, count, off, onClick }) {
        const item = document.createElement("div");
        item.className = "legend-item" + (off ? " off" : "") + (onClick ? "" : " static");
        item.innerHTML =
          swatch +
          `<span class="legend-label">${escapeHtml(label)}</span>` +
          (count === undefined ? "" : `<span class="legend-count">${num(count)}</span>`);
        if (onClick) {
          item.setAttribute("role", "button");
          item.addEventListener("click", onClick);
        }
        return item;
      }

      function section(title) {
        const el = document.createElement("div");
        el.className = "legend-section";
        el.innerHTML = `<h2>${title}</h2>`;
        return el;
      }

      function renderLanguageSection() {
        const el = section("Languages");
        if (!scopedLanguages.length) {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.textContent = "No detected languages in this view.";
          el.appendChild(note);
          return el;
        }

        scopedLanguages.forEach(([lang, count]) => {
          const color = colorForLanguage(lang);
          const on = !disabledLanguages.has(lang);
          const swatch = `<span class="swatch" style="background:${color}"></span>`;
          el.appendChild(
            legendRow({
              swatch,
              label: titleCase(lang),
              count,
              off: !on,
              onClick: () => {
                if (on) disabledLanguages.add(lang);
                else disabledLanguages.delete(lang);
                render();
              },
            }),
          );
        });

        if (viewMode === "areas") {
          const note = document.createElement("p");
          note.className = "legend-note";
          note.style.margin = "10px 0 0";
          if (activeLanguages.length === 0) {
            note.textContent = "Select at least one language to colour the map.";
          } else if (activeLanguages.length === 1) {
            note.textContent =
              `Shade is the share of classified sites in ${titleCase(activeLanguages[0])}, ` +
              "scaled to the strongest area in view.";
          } else {
            note.textContent =
              "Hue is the leading language; shade is how far ahead it is. Pale areas are closely contested.";
          }
          el.appendChild(note);

          if (activeLanguages.length === 1) {
            const color = colorForLanguage(activeLanguages[0]);
            const bar = document.createElement("div");
            bar.className = "scale-bar";

            const labels = document.createElement("div");
            labels.className = "scale-labels";
            labels.innerHTML = `<span>0.0%</span><span>${pct(singleLanguageScale(activeLanguages[0]))}</span>`;
            el.appendChild(bar);
            el.appendChild(labels);
          } else if (activeLanguages.length > 1) {
            const bar = document.createElement("div");
            bar.className = "scale-bar";
            bar.style.background = `linear-gradient(to right, ${mixToWhite("#555555", LEAD_FLOOR)}, #555555)`;
            const labels = document.createElement("div");
            labels.className = "scale-labels";
            labels.innerHTML = `<span>tied</span><span>uncontested</span>`;
            el.appendChild(bar);
            el.appendChild(labels);
          }

          el.appendChild(
            legendRow({
              swatch: `<span class="swatch missing"></span>`,
              label: "No classified sites",
            }),
          );
        } else {
          el.appendChild(
            legendRow({
              swatch: `<span class="swatch" style="background:${UNCLASSIFIED_COLOR}"></span>`,
              label: "No language detected",
              off: !showUnclassified,
              onClick: () => {
                showUnclassified = !showUnclassified;
                render();

      function renderAreaNav() {
        const wrap = document.createElement("div");
        wrap.className = "legend-section";
        const kind = viewingKind();
        const title = currentParent
          ? `${KIND_LABEL[kind]} · ${currentParent.name}`
          : "Countries";
        wrap.innerHTML = `<h2>${escapeHtml(title)}</h2>`;
        const intro = document.createElement("p");
        intro.className = "legend-note";
        if (kind === "country") {
          intro.textContent = "Click a country to open its subdivision 1 areas.";
        } else if (kind === "subdivision_1") {
          intro.textContent = `Click a subdivision 1 area to open subdivision 2.`;
        } else {
          intro.textContent = "Subdivision 2 is as far as the map drills.";
        }
        wrap.appendChild(intro);
        const stats = authorityStats();
        const rows = [...stats.values()].sort(
          (a, b) => b.classified - a.classified || a.feature.properties.name.localeCompare(b.feature.properties.name),
        );
        const withData = rows.filter((rec) => rec.classified);
        const empty = rows.filter((rec) => !rec.classified);
        const list = document.createElement("div");
        list.className = "area-list";
        const addRow = (rec) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const fill = areaFill(rec);
          const color = fill ? mixToWhite(fill.color, fill.intensity) : "#c8c2b6";
          btn.innerHTML =
            `<span class="dot" style="background:${color}"></span>` +
            `<span class="legend-label">${escapeHtml(rec.feature.properties.name)}</span>` +
            `<span class="count">${num(rec.classified)}</span>`;
          btn.addEventListener("click", () => {
            if (kind === "subdivision_2") {
              focusFeature(rec.feature);
              return;
            }
            drillInto(rec.feature).catch((err) =>
              showMapMessage(err.message || `Could not open ${rec.feature.properties.name}.`),
            );
          });
          list.appendChild(btn);
        };
        withData.forEach(addRow);
        if (empty.length && withData.length) {
          const more = document.createElement("button");
          more.type = "button";
          more.style.color = "var(--muted)";
          more.textContent = `${empty.length} more without language data`;
          more.addEventListener("click", () => {
            more.remove();
            empty.forEach(addRow);
          });
          list.appendChild(more);
        } else {
          empty.forEach(addRow);
        }
        wrap.appendChild(list);
        return wrap;
      }

      function renderSidebar() {
        const sidebar = document.getElementById("sidebar");
        sidebar.innerHTML = "";

        if (viewMode === "areas") {
          sidebar.appendChild(renderAreaNav());
        }

        sidebar.appendChild(renderLanguageSection());

        const cats = section("Categories");
        scopedCategories.forEach(([category, count]) => {
          const on = !disabledCategories.has(category);
          cats.appendChild(
            legendRow({
              swatch: `<span class="legend-check"></span>`,

              off: !on,

                else disabledCategories.delete(category);
                invalidateTimeSeries();

              },
            }),
          );
        });
        sidebar.appendChild(cats);

        if (datasets.length > 1) {
          const sets = section("Datasets");

                swatch: `<span class="legend-check"></span>`,
                label: name,

                  else disabledDatasets.delete(name);
                  invalidateTimeSeries();
                  render();
                },

          });
          sidebar.appendChild(sets);
