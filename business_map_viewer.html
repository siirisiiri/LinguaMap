<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinguaMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --void: #0c0b0a;
        --water: #12110f;
        --land: #2c2924;
        --ink: #f3eee4;
        --muted: #8d877b;
        --faint: rgba(243, 238, 228, 0.1);
        --line: rgba(243, 238, 228, 0.12);
        --accent: #d7c4a3;
        --glass: rgba(14, 13, 11, 0.72);
        --ui: "Figtree", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --display: "Fraunces", "Times New Roman", serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--ui);
        font-feature-settings: "tnum" 1, "ss01" 1;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: var(--void);
        color-scheme: dark;
      }
      #app {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      #map {
        position: absolute;
        inset: 0;
        background: var(--water);
        z-index: 0;
      }
      .leaflet-container {
        background: var(--water);
        font-family: var(--ui);
      }
      .leaflet-overlay-pane path {
        transition: fill 480ms ease, stroke 320ms ease, fill-opacity 480ms ease;
      }
      .leaflet-control-zoom {
        border: none !important;
        margin: 0 0 18px 18px !important;
      }
      .leaflet-bar {
        border: none !important;
        box-shadow: none !important;
      }
      .leaflet-bar a,
      .leaflet-bar a:hover,
      .leaflet-bar a:focus {
        width: 32px;
        height: 32px;
        display: flex !important;
        align-items: center;
        justify-content: center;
        padding: 0 !important;
        line-height: 1 !important;
        font-size: 18px !important;
        font-weight: 400;
        text-indent: 0;
        background: rgba(14, 13, 11, 0.82) !important;
        color: var(--ink) !important;
        border: 1px solid var(--line) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .leaflet-bar a.leaflet-disabled {
        opacity: 0.35;
      }
      .leaflet-bar a:first-child {
        border-radius: 8px 8px 0 0;
      }
      .leaflet-bar a:last-child {
        border-radius: 0 0 8px 8px;
        padding-bottom: 3px !important;
      }
      .leaflet-control-attribution {
        background: transparent !important;
        color: var(--muted);
        font-size: 10px;
        font-family: var(--ui);
        margin: 0 14px 8px 0 !important;
      }
      .leaflet-control-attribution a {
        color: var(--muted);
      }
      .hud-top,
      #sidebar,
      #breadcrumb,
      #mapMessage,
      #timeline,
      #hoverCard,
      .panel-toggle {
        pointer-events: auto;
      }
      #app::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 92px;
        z-index: 1040;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(12, 11, 10, 0.32) 0%,
          rgba(12, 11, 10, 0.12) 58%,
          transparent 100%
        );
      }
      .hud-top {
        position: absolute;
        top: 18px;
        left: 20px;
        right: 20px;
        z-index: 1120;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: nowrap;
        padding: 0;
        background: none;
        border: none;
      }
      .hud-top h1 {
        font-family: var(--display);
        font-size: 22px;
        font-weight: 550;
        font-optical-sizing: auto;
        letter-spacing: -0.03em;
        margin: 0;
        white-space: nowrap;
        line-height: 1;
        text-shadow: 0 1px 14px rgba(12, 11, 10, 0.9);
      }
      .metric-toggle {
        display: flex;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        flex-shrink: 0;
      }
      .metric-toggle button {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
        padding: 6px 11px;
        border-radius: 6px;
        cursor: pointer;
      }
      .metric-toggle button.active {
        background: rgba(243, 238, 228, 0.1);
        color: var(--ink);
      }
      .mapped-count {
        margin-left: auto;
        text-align: right;
        line-height: 1;
        flex-shrink: 0;
      }
      .mapped-count[hidden] {
        display: none;
      }
      .mapped-number {
        font-family: var(--display);
        font-optical-sizing: auto;
        font-size: 28px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        line-height: 1;
        text-shadow: 0 1px 14px rgba(12, 11, 10, 0.9);
      }
      .mapped-label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 4px;
        text-shadow: 0 1px 12px rgba(12, 11, 10, 0.9);
      }
      .area-jump {
        display: flex;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
        flex: 1;
        min-width: 120px;
        max-width: 260px;
        position: relative;
      }
      .search-wrap {
        position: relative;
        width: 100%;
      }
      .area-jump label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .area-jump input {
        font: inherit;
        color: var(--ink);
        background: rgba(243, 238, 228, 0.05);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        width: 100%;
        outline: none;
      }
      .area-jump input::placeholder {
        color: var(--muted);
      }
      .area-jump input:focus {
        border-color: rgba(215, 196, 163, 0.45);
      }
      .search-results {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: 100%;
        min-width: 280px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        z-index: 30;
        max-height: 320px;
        overflow-y: auto;
        padding: 4px;
      }
      .search-results[hidden] {
        display: none;
      }
      .search-hit {
        display: flex;
        flex-direction: column;
        gap: 1px;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        border-radius: 7px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
        color: var(--ink);
      }
      .search-hit:hover,
      .search-hit.active {
        background: rgba(243, 238, 228, 0.08);
      }
      .search-hit .name {
        font-size: 13px;
        font-weight: 600;
      }
      .search-hit .meta {
        font-size: 11px;
        color: var(--muted);
      }
      .search-empty {
        padding: 10px 9px;
        font-size: 12px;
        color: var(--muted);
      }
      #breadcrumb {
        display: none;
        position: absolute;
        top: 64px;
        left: 20px;
        z-index: 1100;
        font-size: 12px;
        color: var(--muted);
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        max-width: calc(100% - 340px);
        text-shadow: 0 1px 10px rgba(12, 11, 10, 0.9);
      }
      #breadcrumb.visible {
        display: flex;
      }
      #breadcrumb button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 0;
      }
      #breadcrumb button:disabled {
        color: var(--ink);
        cursor: default;
        font-weight: 600;
      }
      #breadcrumb .sep {
        color: rgba(243, 238, 228, 0.28);
      }
      #mapMessage {
        display: none;
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1100;
        font-size: 12px;
        color: var(--ink);
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      #mapMessage.visible {
        display: block;
      }
      .area-list {
        display: flex;
        flex-direction: column;
        gap: 0;
        overflow-y: auto;
        margin: 0 -4px;
        flex: 1;
        min-height: 0;
      }
      .area-list button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: none;
        background: transparent;
        text-align: left;
        font: inherit;
        color: var(--ink);
        padding: 6px 8px;
        border-radius: 7px;
        cursor: pointer;
      }
      .area-list button:hover {
        background: rgba(243, 238, 228, 0.07);
      }
      .area-list .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #5a554c;
      }
      .area-list .count {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        padding-left: 8px;
      }
      .area-list::-webkit-scrollbar {
        width: 6px;
      }
      .area-list::-webkit-scrollbar-thumb {
        background: rgba(243, 238, 228, 0.12);
        border-radius: 3px;
      }
      #sidebar {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 276px;
        z-index: 1100;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 72px 16px 16px 14px;
        font-size: 13px;
        background: var(--glass);
        border: none;
        border-left: 1px solid var(--line);
        border-radius: 0;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: transform 280ms ease, opacity 220ms ease;
      }
      #app.panel-collapsed #sidebar {
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
      }
      .panel-toggle {
        position: absolute;
        top: 78px;
        right: 276px;
        z-index: 1110;
        width: 22px;
        height: 36px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-right: none;
        border-radius: 8px 0 0 8px;
        background: var(--glass);
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: right 280ms ease, background 160ms ease;
      }
      .panel-toggle:hover {
        color: var(--ink);
        background: rgba(243, 238, 228, 0.08);
      }
      #app.panel-collapsed .panel-toggle {
        right: 0;
        color: var(--ink);
      }
      #app.panel-collapsed #timeline {
        right: 16px;
      }
      #app.panel-collapsed #breadcrumb {
        max-width: calc(100% - 48px);
      }
      #sidebar h2 {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .legend-heading {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 0 8px;
      }
      .legend-heading h2 {
        margin: 0;
      }
      .legend-heading-actions {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .legend-heading-actions button {
        border: none;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        padding: 0;
        letter-spacing: 0;
        text-transform: none;
      }
      .legend-heading-actions button:disabled {
        color: var(--muted);
        cursor: default;
        opacity: 0.55;
      }
      .legend-section {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .legend-section:first-child {
        flex: 1;
        min-height: 0;
      }
      .legend-section + .legend-section {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .legend-section:last-child {
        flex: 0 1 auto;
        max-height: 46%;
        overflow-y: auto;
      }
      .legend-note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
        margin: 0 0 10px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 2px;
        cursor: pointer;
        user-select: none;
      }
      .legend-item.off {
        opacity: 0.38;
      }
      .legend-item.static {
        cursor: default;
      }
      .swatch {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .swatch.missing {
        border-radius: 2px;
        background: var(--land);
        box-shadow: inset 0 0 0 1px rgba(243, 238, 228, 0.16);
      }
      .legend-check {
        display: none;
      }
      .legend-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-count {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        padding-left: 6px;
        font-size: 11px;
      }
      .lang-more {
        border: none;
        background: none;
        color: var(--accent);
        font: inherit;
        font-size: 11px;
        padding: 8px 2px 2px;
        cursor: pointer;
        text-align: left;
      }
      .ramp {
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          #3d332c 0%,
          #8a4e32 35%,
          #c46a3c 65%,
          #e2b17a 100%
        );
        margin: 4px 0 8px;
      }
      .ramp-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-bottom: 10px;
      }
      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--glass);
        color: var(--ink);
        border: 1px solid var(--line);
        box-shadow: none;
      }
      .leaflet-popup-content b {
        display: block;
        margin-bottom: 2px;
        font-family: var(--display);
      }
      .leaflet-popup-content a {
        color: var(--accent);
        word-break: break-all;
      }
      .leaflet-interactive {
        cursor: pointer;
      }
      #hoverCard {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1400;
        pointer-events: none;
        width: 248px;
        padding: 12px 14px 13px;
        background: rgba(16, 14, 12, 0.9);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      #hoverCard[hidden] {
        display: none;
      }
      .hover-name {
        font-family: var(--display);
        font-size: 17px;
        font-weight: 550;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin: 0 0 3px;
      }
      .hover-count {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-bottom: 10px;
      }
      .hover-row {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(52px, 1fr) 32px;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        margin-top: 5px;
      }
      .hover-row span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hover-row span:last-child {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .hover-track {
        height: 3px;
        background: rgba(243, 238, 228, 0.08);
        border-radius: 2px;
        overflow: hidden;
      }
      .hover-track i {
        display: block;
        height: 100%;
        border-radius: 2px;
      }
      #timeline {
        position: absolute;
        left: 16px;
        right: 276px;
        bottom: 16px;
        z-index: 1100;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 14px 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      #timeline.hidden {
        display: none;
      }
      .time-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      #playBtn {
        font: inherit;
        font-size: 10px;
        width: 24px;
        height: 24px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
        flex-shrink: 0;
        padding: 0;
      }
      #playBtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #timeLabel {
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        min-width: 4.6em;
      }
      #timeSummary {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .time-track {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      #timeSlider {
        width: 100%;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
      }
      .time-axis {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-family: var(--display);
        font-size: 22px;
        letter-spacing: -0.03em;
        text-align: center;
        padding: 20px;
        pointer-events: none;
        background: var(--void);
      }
      #overlay.hidden {
        display: none;
      }
      @media (max-width: 720px) {
        .mapped-number {
          font-size: 22px;
        }
        .area-jump {
          max-width: 180px;
        }
        #sidebar {
          width: 240px;
        }
        .panel-toggle {
          right: 240px;
        }
      }
      @media (max-width: 560px) {
        .hud-top {
          flex-wrap: wrap;
          padding-bottom: 12px;
        }
        .area-jump {
          max-width: none;
          flex-basis: 100%;
        }
        #sidebar {
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 34%;
          padding: 14px 16px 16px;
          border-left: none;
          border-top: 1px solid var(--line);
        }
        .panel-toggle {
          top: auto;
          bottom: calc(34% + 12px);
          right: 16px;
          height: 28px;
          width: 36px;
          border-radius: 8px 8px 0 0;
          border-right: 1px solid var(--line);
          border-bottom: none;
        }
        #app.panel-collapsed .panel-toggle {
          bottom: 12px;
          right: 16px;
        }
        #app.panel-collapsed #sidebar {
          transform: translateY(calc(100% + 28px));
        }
        #timeline {
          right: 16px;
          bottom: calc(34% + 24px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <div id="overlay">LinguaMap</div>
      <header class="hud-top">
        <h1>LinguaMap</h1>
        <div class="metric-toggle" role="group" aria-label="Map metric">
          <button type="button" id="metricLead" class="active">Language</button>
          <button type="button" id="metricMulti">Multilingual</button>
        </div>
        <form class="area-jump" id="areaJump" autocomplete="off">
          <label for="areaName">Search</label>
          <div class="search-wrap">
            <input
              id="areaName"
              type="search"
              placeholder="Search places"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="searchResults" class="search-results" hidden></div>
          </div>
        </form>
        <div class="mapped-count" id="mappedCount" hidden>
          <div class="mapped-number" id="mappedNumber">0</div>
          <div class="mapped-label">websites mapped</div>
        </div>
      </header>
      <nav id="breadcrumb" aria-label="Area hierarchy"></nav>
      <div id="mapMessage" role="status"></div>
      <button
        type="button"
        id="panelToggle"
        class="panel-toggle"
        aria-expanded="true"
        aria-controls="sidebar"
        title="Hide panel"
      >›</button>
      <aside id="sidebar"></aside>
      <div id="hoverCard" hidden></div>
      <div id="timeline" class="hidden">
        <div class="time-controls">
          <button type="button" id="playBtn" title="Play through time">▶</button>
          <span id="timeLabel"></span>
          <span id="timeSummary"></span>
        </div>
        <div class="time-track">
          <input type="range" id="timeSlider" min="0" max="0" value="0" step="1"
                 aria-label="Time" />
          <div class="time-axis"><span id="timeStart"></span><span id="timeEnd"></span></div>
        </div>
      </div>
    </div>

    <script>
      // ---------------------------------------------------------------- config

      const LANGUAGE_COLORS = {
        english: "#d8c4a0",
        french: "#c45c6a",
        welsh: "#6a8f4e",
        spanish: "#d4783c",
        german: "#8a6b9a",
        ukrainian: "#c9a035",
        russian: "#c44a3a",
        polish: "#b85a8a",
        romanian: "#7a9a5c",
        hungarian: "#8b3b18",
        belarusian: "#719130",
        slovak: "#8a6848",
        bulgarian: "#765842",
        greek: "#6b5348",
        armenian: "#a04a3c",
        yiddish: "#814096",
        "crimean tatar": "#22775b",
        rusyn: "#88633a",
        gagauz: "#7a5a9a",
        inuktitut: "#5a7a62",
        cree: "#742f3b",
        ojibwe: "#476d2c",
        mikmaq: "#6f4020",
        mohawk: "#6a5344",
        innu: "#753861",
        dene: "#4a453c",
        blackfoot: "#216340",
        japanese: "#e07050",
        korean: "#c45d72",
        "mandarin chinese": "#c9a227",
        arabic: "#6f8a58",
        portuguese: "#c46b3a",
        italian: "#a6844c",
        dutch: "#8a7048",
        hindi: "#cc7a38",
        hebrew: "#b8956a",
        thai: "#c46b58",
        vietnamese: "#b85f4a",
        indonesian: "#c4785c",
        "iranian persian": "#a66b4a",
        azerbaijani: "#8a6a3c",
        kazakh: "#7a8a5a",
        uzbek: "#8a7348",
      };
      const LANGUAGE_PALETTE = [
        "#c45c26",
        "#5c7a0a",
        "#8a4a6b",
        "#a67c32",
        "#4b3d73",
        "#1f7a5c",
        "#7a3b2e",
        "#8a6840",
      ];
      const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                           "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const LAND_RGB = [44, 41, 36];
      const MISSING_FILL = "#2c2924";
      const UNCLASSIFIED_COLOR = "#5a554c";
      const MULTI_RAMP = ["#3d332c", "#8a4e32", "#c46a3c", "#e2b17a"];
      const LEAD_FLOOR = 0.22;
      const MAX_MARKERS = 12000;
      const TOP_LANGUAGES = 8;

      const paletteAssignments = new Map();

      function colorForLanguage(lang) {
        if (LANGUAGE_COLORS[lang]) return LANGUAGE_COLORS[lang];
        if (!paletteAssignments.has(lang)) {
          paletteAssignments.set(
            lang,
            LANGUAGE_PALETTE[paletteAssignments.size % LANGUAGE_PALETTE.length],
          );
        }
        return paletteAssignments.get(lang);
      }

      function titleCase(s) {
        return s.replace(/(^|\s)\S/g, (c) => c.toUpperCase());
      }

      function pct(fraction) {
        return (fraction * 100).toFixed(1) + "%";
      }

      function ptsLabel(fraction) {
        return (fraction * 100).toFixed(1) + " pts";
      }

      function num(n) {
        return n.toLocaleString();
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }

      function mixToLand(hex, t) {
        const raw = hex.replace("#", "");
        const r = parseInt(raw.slice(0, 2), 16);
        const g = parseInt(raw.slice(2, 4), 16);
        const b = parseInt(raw.slice(4, 6), 16);
        const clamped = Math.max(0, Math.min(1, t));
        const mix = (c, i) => Math.round(LAND_RGB[i] + (c - LAND_RGB[i]) * clamped);
        return `rgb(${mix(r, 0)}, ${mix(g, 1)}, ${mix(b, 2)})`;
      }

      function mixToWhite(hex, t) {
        return mixToLand(hex, t);
      }

      function parseHex(hex) {
        const raw = hex.replace("#", "");
        return [
          parseInt(raw.slice(0, 2), 16),
          parseInt(raw.slice(2, 4), 16),
          parseInt(raw.slice(4, 6), 16),
        ];
      }

      function rampColor(t, stops) {
        const ramp = stops || MULTI_RAMP;
        const x = clamp01(t) * (ramp.length - 1);
        const i = Math.min(ramp.length - 2, Math.floor(x));
        const f = x - i;
        const a = parseHex(ramp[i]);
        const b = parseHex(ramp[i + 1]);
        return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)}, ${Math.round(a[1] + (b[1] - a[1]) * f)}, ${Math.round(a[2] + (b[2] - a[2]) * f)})`;
      }

      // ------------------------------------------------------- geometry helpers

      function coordsEqual(a, b) {
        return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
      }

      function mergeWaysToRings(ways) {
        const segs = ways.filter((w) => w.length >= 2).map((w) => w.slice());
        const rings = [];
        while (segs.length) {
          const ring = segs.pop();
          let closed = coordsEqual(ring[0], ring[ring.length - 1]);
          let grew = true;
          while (!closed && grew) {
            grew = false;
            for (let i = segs.length - 1; i >= 0; i--) {
              const s = segs[i];
              if (coordsEqual(ring[ring.length - 1], s[0])) ring.push(...s.slice(1));
              else if (coordsEqual(ring[ring.length - 1], s[s.length - 1]))
                ring.push(...s.slice(0, -1).reverse());
              else if (coordsEqual(ring[0], s[s.length - 1])) ring.unshift(...s.slice(0, -1));
              else if (coordsEqual(ring[0], s[0])) ring.unshift(...s.slice(1).reverse());
              else continue;
              segs.splice(i, 1);
              grew = true;
              closed = coordsEqual(ring[0], ring[ring.length - 1]);
              break;
            }
          }
          if (ring.length >= 4) {
            if (!coordsEqual(ring[0], ring[ring.length - 1])) ring.push(ring[0]);
            rings.push(ring);
          }
        }
        return rings;
      }

      function pointInRing(lon, lat, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const xi = ring[i][0],
            yi = ring[i][1];
          const xj = ring[j][0],
            yj = ring[j][1];
          if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
            inside = !inside;
          }
        }
        return inside;
      }

      function pointInPolygonCoords(lon, lat, coords) {
        if (!pointInRing(lon, lat, coords[0])) return false;
        for (let i = 1; i < coords.length; i++) {
          if (pointInRing(lon, lat, coords[i])) return false;
        }
        return true;
      }

      function pointInGeometry(lon, lat, geom) {
        if (!geom) return false;
        if (geom.type === "Polygon") return pointInPolygonCoords(lon, lat, geom.coordinates);
        if (geom.type === "MultiPolygon") {
          return geom.coordinates.some((poly) => pointInPolygonCoords(lon, lat, poly));
        }
        return false;
      }

      function geomBBox(geom) {
        let minX = 180,
          minY = 90,
          maxX = -180,
          maxY = -90;
        const walk = (c) => {
          if (typeof c[0] === "number") {
            minX = Math.min(minX, c[0]);
            maxX = Math.max(maxX, c[0]);
            minY = Math.min(minY, c[1]);
            maxY = Math.max(maxY, c[1]);
          } else {
            c.forEach(walk);
          }
        };
        walk(geom.coordinates);
        return [minX, minY, maxX, maxY];
      }

      function bboxWidth(bbox) {
        return bbox[2] - bbox[0];
      }

      function bboxContains(bbox, lon, lat) {
        if (bboxWidth(bbox) > 180) return false;
        return lon >= bbox[0] && lon <= bbox[2] && lat >= bbox[1] && lat <= bbox[3];
      }

      function polygonBBox(poly) {
        let minX = 180,
          minY = 90,
          maxX = -180,
          maxY = -90;
        const ring = poly[0] || [];
        for (const pt of ring) {
          minX = Math.min(minX, pt[0]);
          maxX = Math.max(maxX, pt[0]);
          minY = Math.min(minY, pt[1]);
          maxY = Math.max(maxY, pt[1]);
        }
        return [minX, minY, maxX, maxY];
      }

      function eachPartBBox(geom, fn) {
        const polys =
          geom.type === "Polygon" ? [geom.coordinates] : geom.type === "MultiPolygon" ? geom.coordinates : [];
        for (const poly of polys) {
          const bbox = polygonBBox(poly);
          // A dateline-spanning ring's AABB covers most of the world (Alaska).
          if (bboxWidth(bbox) > 180) continue;
          fn(poly, bbox);
        }
      }

      function simplifyRing(ring, maxPts) {
        if (ring.length <= maxPts) return ring;
        const stride = (ring.length - 1) / (maxPts - 1);
        const out = [];
        for (let i = 0; i < maxPts - 1; i++) out.push(ring[Math.floor(i * stride)]);
        out.push(ring[0]);
        return out;
      }

      function relationToGeometry(el) {
        const outers = [];
        const inners = [];
        (el.members || []).forEach((member) => {
          if (!member.geometry || member.geometry.length < 2) return;
          const line = member.geometry.map((p) => [p.lon, p.lat]);
          (member.role === "inner" ? inners : outers).push(line);
        });
        const outerRings = mergeWaysToRings(outers);
        const innerRings = mergeWaysToRings(inners);
        if (!outerRings.length) return null;
        const leftover = innerRings.slice();
        const polygons = outerRings.map((outer) => {
          const holes = leftover.filter((h) => pointInRing(h[0][0], h[0][1], outer));
          holes.forEach((h) => leftover.splice(leftover.indexOf(h), 1));
          return [simplifyRing(outer, 80), ...holes.map((h) => simplifyRing(h, 24))];
        });
        return polygons.length === 1
          ? { type: "Polygon", coordinates: polygons[0] }
          : { type: "MultiPolygon", coordinates: polygons };
      }

      function osmToGeoJSON(osm) {
        const features = [];
        (osm.elements || []).forEach((el) => {
          if (el.type !== "relation") return;
          const tags = el.tags || {};
          const geometry = relationToGeometry(el);
          if (!geometry || !tags.name) return;
          features.push({
            type: "Feature",
            properties: {
              name: tags["name:en"] || tags.name || `relation/${el.id}`,
              admin_level: tags.admin_level,
              osm_type: el.type,
              osm_id: el.id,
            },
            geometry,
          });
        });
        return { type: "FeatureCollection", features };
      }

      function featureId(feature) {
        return `${feature.properties.osm_type}/${feature.properties.osm_id}`;
      }

      // ------------------------------------------------------------------ state

      // One world copy only: OSM tiles wrap by default, which repeats unmarked
      // maps beside the coloured overlay when you zoom out.
      const WORLD_BOUNDS = L.latLngBounds(
        L.latLng(-85.051128, -180),
        L.latLng(85.051128, 180),
      );
      const WORLD_CENTER = [20, 0];

      const map = L.map("map", {
        zoomControl: false,
        preferCanvas: false,
        worldCopyJump: false,
        minZoom: 1,
        zoomSnap: 0.1,
        zoomDelta: 0.5,
        maxBounds: WORLD_BOUNDS,
        maxBoundsViscosity: 1.0,
        attributionControl: true,
      }).setView(WORLD_CENTER, 2);
      L.control.zoom({ position: "bottomleft" }).addTo(map);
      map.attributionControl.setPrefix("");
      map.attributionControl.addAttribution(
        '<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      );
      const markerLayer = L.layerGroup().addTo(map);

      function worldFillZoom() {
        const { x: width, y: height } = map.getSize();
        if (!width || !height) return 2;
        // One Web Mercator world is a 256 × 2^z square. Cover the pane so a
        // single globe reads edge-to-edge; round up so it never undershoots.
        const raw = Math.log2(Math.max(width, height) / 256) + 0.05;
        const snap = map.options.zoomSnap || 0.1;
        return Math.max(1, Math.min(Math.ceil(raw / snap) * snap, 8));
      }

      function lockToSingleWorld() {
        map.setMinZoom(worldFillZoom());
      }

      function showWorld(animate) {
        map.invalidateSize({ animate: false });
        const zoom = worldFillZoom();
        map.setMinZoom(zoom);
        map.setView(WORLD_CENTER, zoom, { animate: Boolean(animate) });
      }

      function isWorldView() {
        return hierarchy.length <= 1;
      }

      let worldFitTimer = 0;
      function scheduleWorldFit() {
        clearTimeout(worldFitTimer);
        worldFitTimer = setTimeout(() => {
          lockToSingleWorld();
          if (isWorldView()) showWorld();
        }, 50);
      }

      let points = [];
      let datasets = [];
      let viewMode = "areas";
      let mapMetric = "lead";
      let listFilter = "";
      let showAllLanguages = false;
      let mappedCountAnimated = false;
      let panelCollapsed = false;

      // User's explicit "off" switches. Everything relevant is on by default, so
      // a language appearing after a drill-down starts visible.
      const disabledLanguages = new Set();
      const disabledCategories = new Set();
      const disabledDatasets = new Set();
      let showUnclassified = false;

      // Recomputed by refreshScope() on every filter/drill change.
      let scopedLanguages = [];
      let activeLanguages = [];
      let activeLanguageSet = new Set();
      let scopedCategories = [];
      let languageTotals = new Map();

      let authorityFeatures = [];
      let choroplethLayer = null;
      let hierarchy = [];
      let currentParent = null;
      const authorityCache = new Map();
      // In-flight boundary fetches, so a background warm-up and a click on the
      // same area share one request instead of racing each other.
      const childrenRequests = new Map();
      let adminIndexPromise = null;
      let drillBusy = false;
      let pendingDrill = null;
      let searchHits = [];
      let searchActive = -1;
      let searchTimer = null;
      let searchAbort = null;

      const KIND_LABEL = {
        country: "Country",
        subdivision_1: "Subdivision 1",
        subdivision_2: "Subdivision 2",
      };

      function kindFromLevel(adminLevel) {
        const level = parseInt(adminLevel || "99", 10);
        if (level <= 2) return "country";
        if (level <= 4) return "subdivision_1";
        return "subdivision_2";
      }

      function viewingKind() {
        if (hierarchy.length <= 1) return "country";
        if (hierarchy.length === 2) return "subdivision_1";
        return "subdivision_2";
      }

      function childKindOf(kind) {
        return kind === "country" ? "subdivision_1" : "subdivision_2";
      }

      // Timeline. Months are ints (year * 12 + month - 1) so the slider and
      // interval lookups share one coordinate. Only Ukraine (primary name) and
      // Wales (Welsh on the name / name:cy) have OSM name history.
      const TIMED_PLACES = {
        ukraine: { dataset: "ukraine", useAvailable: false },
        wales: { dataset: "wales", useAvailable: true },
      };
      let timeAvailable = false;
      let timeEnabled = false;
      let timedPlace = null;
      let timeLo = 0;
      let timeHi = 0;
      let timeStops = [];
      let currentMonth = 0;
      let playTimer = null;
      let seriesCache = null;

      // ------------------------------------------------------------ data loading

      function normalizeLanguages(value) {
        if (!Array.isArray(value)) return typeof value === "string" && value ? [value] : [];
        return [...new Set(value.filter((v) => typeof v === "string" && v).map((v) => v.toLowerCase()))];
      }

      function topLevelCategory(catString) {
        return (catString || "").split("=")[0] || "unclassified";
      }

      async function loadDatasets() {
        let manifest;
        try {
          const resp = await fetch("api/datasets");
          if (!resp.ok) throw new Error(String(resp.status));
          manifest = await resp.json();
        } catch (err) {
          setOverlay(
            "Could not reach the dataset index.<br>Start the viewer with <code>python3 serve.py</code>.",
          );
          return;
        }
        if (!manifest.length) {
          setOverlay("No datasets found in <code>data/</code>.");
          return;
        }

        const loaded = await Promise.all(
          manifest.map(async (entry) => {
            const resp = await fetch(entry.url);
            if (!resp.ok) return { ...entry, rows: [] };
            return { ...entry, rows: await resp.json() };
          }),
        );

        points = [];
        datasets = [];
        loaded.forEach((set) => {
          let kept = 0;
          (set.rows || []).forEach((b) => {
            if (typeof b.lat !== "number" || typeof b.lon !== "number") return;
            points.push({
              lat: b.lat,
              lon: b.lon,
              name: b.name || "(unnamed)",
              website: b.website || "",
              category: topLevelCategory(b.category),
              rawCategory: b.category || "",
              langs: normalizeLanguages(b.language),
              staticLangs: normalizeLanguages(b.language),
              hist: parseHistory(b.lang_history),
              historySource: b.history_source || "",
              dataset: set.name,
              authorityId: null,
              primaryLang: null,
              marker: null,
            });
            kept += 1;
          });
          datasets.push({ name: set.name, count: kept });
        });
        datasets.sort((a, b) => b.count - a.count);
        assignPrimaryLanguages();
        initTimeline();
        updateMappedCount();
      }

      function animateNumber(el, to) {
        const start = performance.now();
        const dur = 1200;
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        const frame = (now) => {
          const t = Math.min(1, (now - start) / dur);
          el.textContent = num(Math.round(to * ease(t)));
          if (t < 1) requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }

      function updateMappedCount() {
        const wrap = document.getElementById("mappedCount");
        const el = document.getElementById("mappedNumber");
        if (!wrap || !el) return;
        wrap.hidden = !points.length;
        if (!points.length) return;
        if (!mappedCountAnimated) {
          mappedCountAnimated = true;
          animateNumber(el, points.length);
        } else {
          el.textContent = num(points.length);
        }
      }

      // ------------------------------------------------------------- timeline

      function monthOf(dateStr) {
        const m = /^(\d{4})-(\d{2})/.exec(String(dateStr || ""));
        return m ? Number(m[1]) * 12 + (Number(m[2]) - 1) : null;
      }

      function monthLabel(idx) {
        const y = Math.floor(idx / 12);
        return `${MONTH_NAMES[idx - y * 12]} ${y}`;
      }

      /** wayback_history.py intervals -> month-indexed, ascending. */
      function parseHistory(raw) {
        if (!Array.isArray(raw) || !raw.length) return null;
        const out = [];
        raw.forEach((iv) => {
          const from = monthOf(iv.from);
          if (from === null) return;
          out.push({
            from,
            to: monthOf(iv.to) ?? from,
            primary: typeof iv.primary === "string" ? iv.primary.toLowerCase() : null,
            available: normalizeLanguages(iv.available),
            landingPath: iv.landing_path || "",
          });
        });
        out.sort((a, b) => a.from - b.from);
        return out.length ? out : null;
      }

      /**
       * State of a site in a given month, carrying the last observation forward
       * across gaps. Before its first snapshot a site returns null rather than a
       * guess, so "not observed yet" stays distinct from "no language detected".
       */
      function stateAt(p, month) {
        const h = p.hist;
        if (!h || month < h[0].from) return null;
        let found = h[0];
        for (let i = 1; i < h.length && h[i].from <= month; i++) found = h[i];
        return found;
      }

      function datasetStem(name) {
        return String(name || "").toLowerCase();
      }

      function langsAtState(st, place) {
        if (!st) return [];
        const spec = TIMED_PLACES[place];
        if (spec && spec.useAvailable && st.available.length) return st.available.slice();
        return st.primary ? [st.primary] : [];
      }

      /**
       * Ukraine country (and its oblasts) or Wales (including UK › Wales).
       * United Kingdom as a whole, and every other country, stay untimed.
       */
      function placeFromHierarchy() {
        if (hierarchy.length <= 1) return null;
        const names = hierarchy.slice(1).map((h) => String(h.name || "").toLowerCase());
        if (names.includes("ukraine")) return "ukraine";
        if (names.includes("wales") || names.includes("cymru")) return "wales";
        const current = hierarchy[hierarchy.length - 1];
        const isos = (current.features || [])
          .map((f) => String((f.properties || {}).parent_iso || (f.properties || {}).iso || "").toUpperCase())
          .filter(Boolean);
        if (isos.length && isos.every((i) => i === "UA" || i.startsWith("UA-"))) return "ukraine";
        if (isos.length && isos.every((i) => i === "GB-WLS")) return "wales";
        return null;
      }

      function viewingPresent() {
        return !timeStops.length || currentMonth === timeStops[timeStops.length - 1];
      }

      /** Push the selected month into the fields the rest of the app reads. */
      function applyTime() {
        if (!timeEnabled || !timedPlace) return;
        const stem = TIMED_PLACES[timedPlace].dataset;
        // Latest stop is the crawled website/name snapshot — keep that map.
        // OSM name history only replaces it when you move the slider back.
        if (viewingPresent()) {
          points.forEach((p) => {
            if (datasetStem(p.dataset) !== stem) return;
            p.langs = p.staticLangs.slice();
            p.primaryLang = null;
          });
          assignPrimaryLanguages();
          return;
        }
        points.forEach((p) => {
          if (datasetStem(p.dataset) !== stem) return;
          if (!p.hist) {
            p.langs = [];
            p.primaryLang = null;
            if (p.marker) {
              p.marker.setStyle({ color: UNCLASSIFIED_COLOR, fillColor: UNCLASSIFIED_COLOR });
            }
            return;
          }
          const langs = langsAtState(stateAt(p, currentMonth), timedPlace);
          p.langs = langs;
          p.primaryLang = langs.includes("welsh")
            ? "welsh"
            : langs.includes("ukrainian")
              ? "ukrainian"
              : langs[0] || null;
          if (p.marker) {
            const color = p.primaryLang ? colorForLanguage(p.primaryLang) : UNCLASSIFIED_COLOR;
            p.marker.setStyle({ color, fillColor: color });
          }
        });
      }

      function rebuildTimelineRange(place) {
        const stem = TIMED_PLACES[place].dataset;
        const withHistory = points.filter((p) => p.hist && datasetStem(p.dataset) === stem);
        const stopSet = new Set();
        let lo = Infinity;
        let hi = -Infinity;
        withHistory.forEach((p) => {
          lo = Math.min(lo, p.hist[0].from);
          hi = Math.max(hi, p.hist[p.hist.length - 1].to);
          p.hist.forEach((iv) => {
            stopSet.add(iv.from);
            stopSet.add(iv.to);
          });
        });
        timeLo = lo;
        timeHi = Math.max(hi, lo);
        timeStops = [...stopSet].filter((m) => m >= timeLo && m <= timeHi).sort((a, b) => a - b);
        if (!timeStops.length) timeStops = [timeLo, timeHi];
        currentMonth = timeStops[timeStops.length - 1];

        const slider = document.getElementById("timeSlider");
        slider.min = "0";
        slider.max = String(Math.max(0, timeStops.length - 1));
        slider.value = String(timeStops.length - 1);
        document.getElementById("timeStart").textContent = monthLabel(timeLo);
        document.getElementById("timeEnd").textContent = monthLabel(timeHi);
        invalidateTimeSeries();
      }

      function initTimeline() {
        timeAvailable = points.some((p) => p.hist && TIMED_PLACES[datasetStem(p.dataset)]);
      }

      function historyInView() {
        if (!timeAvailable) return null;
        const place = placeFromHierarchy();
        if (!place) return null;
        const stem = TIMED_PLACES[place].dataset;
        let scoped = 0;
        let hist = 0;
        points.forEach((p) => {
          if (!inScope(p)) return;
          scoped += 1;
          if (p.hist && datasetStem(p.dataset) === stem) hist += 1;
        });
        if (hist >= 20 && hist >= scoped * 0.2) return place;
        return null;
      }

      function restoreStaticLanguages() {
        points.forEach((p) => {
          p.langs = p.staticLangs.slice();
          p.primaryLang = null;
        });
        assignPrimaryLanguages();
      }

      function syncTimeline() {
        const place = historyInView();
        const show = Boolean(place);
        const was = timeEnabled;
        if (place && place !== timedPlace) rebuildTimelineRange(place);
        timedPlace = place;
        timeEnabled = show;
        const el = document.getElementById("timeline");
        const wasHidden = el.classList.contains("hidden");
        el.classList.toggle("hidden", !show);
        if (show) applyTime();
        else if (was) {
          setPlaying(false);
          restoreStaticLanguages();
        }
        if (wasHidden === show) map.invalidateSize();
      }

      function seekStop(index) {
        const i = Math.max(0, Math.min(timeStops.length - 1, index));
        const next = timeStops[i];
        if (next === currentMonth && document.getElementById("timeSlider").value === String(i)) return;
        currentMonth = next;
        document.getElementById("timeSlider").value = String(i);
        applyTime();
        render();
      }

      /**
       * Share of each primary language per month, over the points currently in
       * scope. Built by walking each site's intervals rather than probing every
       * month, and cached until a filter changes.
       */
      function timeSeries() {
        if (seriesCache) return seriesCache;
        const span = timeHi - timeLo + 1;
        const counts = Array.from({ length: span }, () => new Map());
        const totals = new Array(span).fill(0);
        const overall = new Map();

        points.forEach((p) => {
          if (!p.hist || !datasetEnabled(p) || disabledCategories.has(p.category)) return;
          if (timedPlace && datasetStem(p.dataset) !== TIMED_PLACES[timedPlace].dataset) return;
          if (viewMode === "areas" && authorityFeatures.length && p.authorityId === null) return;
          for (let i = 0; i < p.hist.length; i++) {
            const langs = langsAtState(p.hist[i], timedPlace);
            if (!langs.length) continue;
            const from = Math.max(timeLo, p.hist[i].from);
            const until = i + 1 < p.hist.length ? p.hist[i + 1].from - 1 : timeHi;
            for (let m = from; m <= Math.min(timeHi, until); m++) {
              const slot = counts[m - timeLo];
              langs.forEach((lang) => slot.set(lang, (slot.get(lang) || 0) + 1));
              totals[m - timeLo] += 1;
              langs.forEach((lang) => overall.set(lang, (overall.get(lang) || 0) + 1));
            }
          }
        });

        const order = [...overall.entries()]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .map(([lang]) => lang);
        seriesCache = { counts, totals, order, span };
        return seriesCache;
      }

      function updateTimeSummary() {
        if (!timeEnabled) return;
        document.getElementById("timeLabel").textContent = monthLabel(currentMonth);
        const preferred = timedPlace === "wales" ? ["welsh", "english"]
          : timedPlace === "ukraine" ? ["ukrainian", "russian"]
          : [];
        const writeRows = (order, getCount, total) => {
          if (!total) {
            document.getElementById("timeSummary").textContent = "";
            return;
          }
          const rows = order
            .map((lang) => [lang, getCount(lang)])
            .filter(([, c]) => c)
            .sort((a, b) => {
              const pa = preferred.indexOf(a[0]);
              const pb = preferred.indexOf(b[0]);
              if (pa !== -1 || pb !== -1) return (pa === -1 ? 99 : pa) - (pb === -1 ? 99 : pb);
              return b[1] - a[1];
            })
            .slice(0, 2);
          document.getElementById("timeSummary").textContent = rows
            .map(([lang, c]) => `${titleCase(lang)} ${pct(c / total)}`)
            .join(" · ");
        };
        if (viewingPresent()) {
          const counts = new Map();
          let total = 0;
          points.forEach((p) => {
            if (!inScope(p) || !p.langs.length) return;
            total += 1;
            p.langs.forEach((lang) => counts.set(lang, (counts.get(lang) || 0) + 1));
          });
          writeRows([...counts.keys()], (lang) => counts.get(lang) || 0, total);
          return;
        }
        const { counts, totals, order } = timeSeries();
        const i = currentMonth - timeLo;
        writeRows(order, (lang) => counts[i].get(lang) || 0, totals[i] || 0);
      }

      function setPlaying(on) {
        if (playTimer) {
          clearInterval(playTimer);
          playTimer = null;
        }
        const btn = document.getElementById("playBtn");
        if (btn) btn.textContent = on ? "❚❚" : "▶";
        if (!on) return;
        playTimer = setInterval(() => {
          const at = timeStops.indexOf(currentMonth);
          const next = at < 0 || at >= timeStops.length - 1 ? 0 : at + 1;
          seekStop(next);
        }, 700);
      }

      /**
       * A bilingual site is plotted in its rarest *selected* language, so
       * minority presence stays visible when that language is on, but turning
       * Welsh off does not leave Welsh-coloured dots on an English-only map.
       */
      function assignPrimaryLanguages() {
        languageTotals = new Map();
        points.forEach((p) => p.langs.forEach((l) => languageTotals.set(l, (languageTotals.get(l) || 0) + 1)));
        points.forEach((p) => {
          p.primaryLang = p.langs.reduce(
            (rarest, l) =>
              rarest === null || languageTotals.get(l) < languageTotals.get(rarest) ? l : rarest,
            null,
          );
        });
      }

      /** Rarest language on this site that is currently selected. */
      function displayLang(p) {
        let best = null;
        for (const l of p.langs) {
          if (!activeLanguageSet.has(l)) continue;
          if (
            best === null ||
            (languageTotals.get(l) || 0) < (languageTotals.get(best) || 0) ||
            ((languageTotals.get(l) || 0) === (languageTotals.get(best) || 0) && l < best)
          ) {
            best = l;
          }
        }
        return best;
      }

      // ------------------------------------------------------- filtering & scope

      function datasetEnabled(p) {
        return !disabledDatasets.has(p.dataset);
      }

      /** Points that count toward the current view's language statistics. */
      function inScope(p) {
        if (!datasetEnabled(p)) return false;
        if (disabledCategories.has(p.category)) return false;
        if (viewMode === "areas" && authorityFeatures.length) return p.authorityId !== null;
        return true;
      }

      function isPointVisible(p) {
        if (!datasetEnabled(p) || disabledCategories.has(p.category)) return false;
        if (!p.langs.length) return showUnclassified;
        return displayLang(p) !== null;
      }

      /**
       * Rebuild the language and category lists from whatever is currently in
       * view, so the sidebar only offers choices that mean something here.
       */
      function refreshScope() {
        const langCounts = new Map();
        const catCounts = new Map();
        points.forEach((p) => {
          if (!datasetEnabled(p)) return;
          if (viewMode === "areas" && authorityFeatures.length && p.authorityId === null) return;
          catCounts.set(p.category, (catCounts.get(p.category) || 0) + 1);
          if (disabledCategories.has(p.category)) return;
          p.langs.forEach((l) => langCounts.set(l, (langCounts.get(l) || 0) + 1));
        });
        const byCountThenName = (a, b) => b[1] - a[1] || a[0].localeCompare(b[0]);
        languageTotals = langCounts;
        scopedLanguages = [...langCounts.entries()].sort(byCountThenName);
        scopedCategories = [...catCounts.entries()].sort(byCountThenName);
        activeLanguages = scopedLanguages
          .map(([l]) => l)
          .filter((l) => !disabledLanguages.has(l));
        activeLanguageSet = new Set(activeLanguages);
      }

      // -------------------------------------------------------- area statistics

      function assignAuthorities() {
        points.forEach((p) => {
          p.authorityId = null;
        });
        if (!authorityFeatures.length) {
          invalidateTimeSeries();
          return;
        }
        let west = 180,
          south = 90,
          east = -180,
          north = -90;
        const ranked = authorityFeatures.map((f) => {
          const bbox = geomBBox(f.geometry);
          const wraps = bboxWidth(bbox) > 180;
          if (!wraps) {
            west = Math.min(west, bbox[0]);
            south = Math.min(south, bbox[1]);
            east = Math.max(east, bbox[2]);
            north = Math.max(north, bbox[3]);
          }
          return {
            f,
            bbox,
            wraps,
            id: featureId(f),
            area: wraps ? 0 : Math.max(0, bbox[2] - bbox[0]) * Math.max(0, bbox[3] - bbox[1]),
          };
        });
        ranked.sort((a, b) => b.area - a.area);
        const world = west > east;
        const CELL = 0.5;
        const grid = new Map();
        const cellKey = (lon, lat) => `${Math.floor(lon / CELL)},${Math.floor(lat / CELL)}`;
        const candidates = [];
        points.forEach((p) => {
          if (!world && (p.lon < west || p.lon > east || p.lat < south || p.lat > north)) return;
          candidates.push(p);
          const k = cellKey(p.lon, p.lat);
          const bucket = grid.get(k);
          if (bucket) bucket.push(p);
          else grid.set(k, [p]);
        });
        for (const { f, id } of ranked) {
          eachPartBBox(f.geometry, (poly, bbox) => {
            const minI = Math.floor(bbox[0] / CELL);
            const maxI = Math.floor(bbox[2] / CELL);
            const minJ = Math.floor(bbox[1] / CELL);
            const maxJ = Math.floor(bbox[3] / CELL);
            for (let i = minI; i <= maxI; i++) {
              for (let j = minJ; j <= maxJ; j++) {
                const bucket = grid.get(`${i},${j}`);
                if (!bucket) continue;
                for (const p of bucket) {
                  if (!bboxContains(bbox, p.lon, p.lat)) continue;
                  if (pointInPolygonCoords(p.lon, p.lat, poly)) p.authorityId = id;
                }
              }
            }
          });
        }
        invalidateTimeSeries();
      }

      /**
       * Per-area language tallies. `classified` counts sites with any detected
       * language, so a single-language share reads as "x% of classified sites".
       */
      let areaStatsCache = null;
      let shareScaleCache = null;
      let areaMonthCache = null;

      function authorityStats() {
        if (areaStatsCache) return areaStatsCache;
        const byId = new Map();
        authorityFeatures.forEach((f) => {
          byId.set(featureId(f), {
            feature: f,
            counts: new Map(),
            classified: 0,
            total: 0,
            multilingual: 0,
            pairs: new Map(),
          });
        });
        points.forEach((p) => {
          if (!inScope(p) || !p.authorityId) return;
          const rec = byId.get(p.authorityId);
          if (!rec) return;
          rec.total += 1;
          if (!p.langs.length) return;
          rec.classified += 1;
          if (p.langs.length >= 2) {
            rec.multilingual += 1;
            const pair = [...p.langs].sort().slice(0, 2).join(" + ");
            rec.pairs.set(pair, (rec.pairs.get(pair) || 0) + 1);
          }
          p.langs.forEach((l) => rec.counts.set(l, (rec.counts.get(l) || 0) + 1));
        });
        areaStatsCache = byId;
        return byId;
      }

      /**
       * Language the choropleth should track while the time slider is up.
       * Wales with English+Welsh both on would otherwise paint "English lead",
       * which shrinks (and washes Gwynedd out) as Welsh grows.
       */
      function timelineFillLanguage() {
        if (!activeLanguages.length) return null;
        if (timedPlace === "wales" && activeLanguageSet.has("welsh")) return "welsh";
        if (timedPlace === "ukraine" && activeLanguageSet.has("ukrainian") && activeLanguages.length === 1) {
          return "ukrainian";
        }
        if (activeLanguages.length === 1) return activeLanguages[0];
        return null;
      }

      /** Per-area language counts at every slider stop.
       *
       *  Raw share (welsh / all shops on the map) falls in places like Gwynedd
       *  just because OSM added a wave of English shops later. The fill uses a
       *  coverage-stable share instead: new Welsh shops still count, but new
       *  English-only shops do not dilute the heartland.
       */
      function areaMonthStats() {
        if (areaMonthCache) return areaMonthCache;
        const stops = timeStops.length ? timeStops : [currentMonth];
        const members = [];
        const stem = timedPlace && TIMED_PLACES[timedPlace] ? TIMED_PLACES[timedPlace].dataset : null;
        points.forEach((p) => {
          if (!p.hist || !p.authorityId) return;
          if (!datasetEnabled(p) || disabledCategories.has(p.category)) return;
          if (stem && datasetStem(p.dataset) !== stem) return;
          const langsByStop = stops.map((month) => langsAtState(stateAt(p, month), timedPlace));
          const first = langsByStop.findIndex((langs) => langs.length);
          if (first < 0) return;
          members.push({ auth: p.authorityId, first, langsByStop });
        });
        const byId = new Map();
        authorityFeatures.forEach((f) => {
          const id = featureId(f);
          const mine = members.filter((m) => m.auth === id);
          const areaFirst = mine.reduce((min, m) => Math.min(min, m.first), stops.length);
          const slots = stops.map(() => ({
            counts: new Map(),
            classified: 0,
            stable: new Map(),
          }));
          mine.forEach((m) => {
            for (let i = 0; i < stops.length; i++) {
              const langs = m.langsByStop[i];
              if (!langs.length) continue;
              slots[i].classified += 1;
              langs.forEach((lang) => slots[i].counts.set(lang, (slots[i].counts.get(lang) || 0) + 1));
            }
          });
          const langsSeen = new Set();
          mine.forEach((m) => m.langsByStop.forEach((langs) => langs.forEach((lang) => langsSeen.add(lang))));
          langsSeen.forEach((lang) => {
            for (let i = 0; i < stops.length; i++) {
              let focus = 0;
              let cohortOther = 0;
              mine.forEach((m) => {
                const langs = m.langsByStop[i];
                if (!langs.length) return;
                if (langs.includes(lang)) focus += 1;
                else if (m.first === areaFirst) cohortOther += 1;
              });
              const den = focus + cohortOther;
              if (den) slots[i].stable.set(lang, focus / den);
            }
          });
          byId.set(id, { slots, areaFirst });
        });
        areaMonthCache = { byId, stops };
        return areaMonthCache;
      }

      function slotAtCurrentMonth(rec) {
        if (!rec || !rec.feature) return null;
        const { byId, stops } = areaMonthStats();
        const row = byId.get(featureId(rec.feature));
        if (!row) return null;
        let i = stops.indexOf(currentMonth);
        if (i < 0) i = stops.length - 1;
        return row.slots[i] || null;
      }

      /**
       * Min/max coverage-stable share of `lang` across every area × year, plus
       * each area's own range so the heartland can still darken as it grows.
       */
      function temporalShareMeta(lang) {
        if (shareScaleCache && shareScaleCache.mode === "temporal" && shareScaleCache.lang === lang) {
          return shareScaleCache;
        }
        const { byId } = areaMonthStats();
        const byArea = new Map();
        let glo = Infinity;
        let ghi = -Infinity;
        byId.forEach((row, id) => {
          let lo = Infinity;
          let hi = -Infinity;
          row.slots.forEach((s) => {
            if (!s.stable.has(lang)) return;
            const share = s.stable.get(lang);
            if (share < lo) lo = share;
            if (share > hi) hi = share;
            if (share < glo) glo = share;
            if (share > ghi) ghi = share;
          });
          if (isFinite(lo)) byArea.set(id, { lo, hi });
        });
        if (!isFinite(glo)) {
          glo = 0;
          ghi = 1;
        }
        shareScaleCache = { mode: "temporal", lang, lo: glo, hi: Math.max(ghi, glo + 0.04), byArea };
        return shareScaleCache;
      }

      function clamp01(t) {
        return Math.max(0, Math.min(1, t));
      }

      /**
       * One language selected: intensity is that language's share of classified
       * sites, relative to the strongest area on screen. Two or more: hue is the
       * leading language, intensity is how far ahead it is in relative share
       * among the selected languages.
       *
       * With the time slider up, the ramp is locked to the whole timeline and
       * mixed with each area's own min–max so a heartland like Gwynedd darkens
       * as Welsh grows there instead of washing out when the rest of Wales catches up.
       */
      function areaFill(rec) {
        if (mapMetric === "multilingual") {
          if (!rec || !rec.classified) return null;
          const share = rec.multilingual / rec.classified;
          return {
            lang: null,
            color: rampColor(share),
            intensity: 1,
            share,
            multilingual: rec.multilingual,
            lead: null,
          };
        }
        if (!rec || !rec.classified || !activeLanguages.length) return null;
        const timedLang = timeEnabled && !viewingPresent() ? timelineFillLanguage() : null;
        if (timedLang) {
          const slot = slotAtCurrentMonth(rec);
          const raw = (rec.counts.get(timedLang) || 0) / rec.classified;
          const share = slot && slot.stable.has(timedLang) ? slot.stable.get(timedLang) : raw;
          const meta = temporalShareMeta(timedLang);
          const spatial = meta.hi > meta.lo ? (share - meta.lo) / (meta.hi - meta.lo) : 0.5;
          const local = rec.feature ? meta.byArea.get(featureId(rec.feature)) : null;
          let localT = 0.5;
          if (local && local.hi - local.lo >= 0.012) {
            localT = (share - local.lo) / (local.hi - local.lo);
          }
          let t = 0.62 * clamp01(spatial) + 0.38 * clamp01(localT);
          if (share > 0) t = 0.16 + 0.84 * t;
          return {
            lang: timedLang,
            color: colorForLanguage(timedLang),
            intensity: clamp01(t),
            share,
            rawShare: raw,
            lead: null,
            scale: meta.hi,
            localLo: local ? local.lo : null,
            localHi: local ? local.hi : null,
          };
        }
        if (activeLanguages.length === 1) {
          const lang = activeLanguages[0];
          const share = (rec.counts.get(lang) || 0) / rec.classified;
          let max = 0;
          if (shareScaleCache && shareScaleCache.mode === "static" && shareScaleCache.lang === lang && shareScaleCache.max != null) {
            max = shareScaleCache.max;
          } else {
            authorityStats().forEach((other) => {
              if (!other.classified) return;
              max = Math.max(max, (other.counts.get(lang) || 0) / other.classified);
            });
            shareScaleCache = { mode: "static", lang, max: max || 1 };
            max = shareScaleCache.max;
          }
          return {
            lang,
            color: colorForLanguage(lang),
            intensity: share / max,
            share,
            lead: null,
            scale: max,
          };
        }
        const ranked = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
        const total = ranked.reduce((sum, [, c]) => sum + c, 0);
        // Classified, but none of the selected languages: white rather than the
        // hatched "no data" fill, since 0% is a real answer.
        if (!total) return { lang: null, color: MISSING_FILL, intensity: 1, share: 0, lead: 0 };
        const lead = (ranked[0][1] - ranked[1][1]) / total;
        return {
          lang: ranked[0][0],
          color: colorForLanguage(ranked[0][0]),
          intensity: LEAD_FLOOR + (1 - LEAD_FLOOR) * lead,
          share: ranked[0][1] / rec.classified,
          lead,
        };
      }

      function hoverBars(rows) {
        if (!rows.length) return "";
        const max = Math.max(...rows.map((r) => r.share), 0.001);
        return rows
          .map(
            (r) =>
              `<div class="hover-row"><span>${escapeHtml(r.label)}</span>` +
              `<div class="hover-track"><i style="width:${Math.max(4, (r.share / max) * 100)}%;background:${r.color}"></i></div>` +
              `<span>${Math.round(r.share * 100)}%</span></div>`,
          )
          .join("");
      }

      function areaTooltip(feature, rec) {
        const name = escapeHtml(feature.properties.name);
        const total = rec ? rec.total : 0;
        const count = total
          ? `${num(total)} website${total === 1 ? "" : "s"}`
          : "No websites here";
        if (mapMetric === "multilingual") {
          if (!rec || !rec.classified) {
            return `<div class="hover-name">${name}</div><div class="hover-count">${count}</div>`;
          }
          const share = rec.multilingual / rec.classified;
          const pairs = [...rec.pairs.entries()]
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
            .filter(([, c]) => c / rec.classified >= 0.02)
            .slice(0, 4)
            .map(([label, c]) => ({
              label: titleCase(label),
              share: c / rec.classified,
              color: rampColor(Math.min(1, c / rec.classified + 0.25)),
            }));
          return (
            `<div class="hover-name">${name}</div>` +
            `<div class="hover-count">${count} · ${Math.round(share * 100)}% multilingual</div>` +
            hoverBars(pairs)
          );
        }
        if (!rec || !rec.classified) {
          return `<div class="hover-name">${name}</div><div class="hover-count">${count}</div>`;
        }
        const rows = activeLanguages
          .map((l) => [l, rec.counts.get(l) || 0])
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 5)
          .filter(([, c]) => c)
          .map(([l, c]) => ({
            label: titleCase(l),
            share: c / rec.classified,
            color: colorForLanguage(l),
          }));
        const changeLine =
          timeEnabled && !viewingPresent()
            ? (() => {
                const fill = areaFill(rec);
                if (!fill || fill.localLo == null || fill.share == null || !fill.lang) return "";
                const delta = fill.share - fill.localLo;
                return `<div class="hover-count" style="margin:8px 0 0">${escapeHtml(titleCase(fill.lang))} ${
                  delta >= 0 ? "+" : ""
                }${ptsLabel(delta)} vs this area's low</div>`;
              })()
            : "";
        return (
          `<div class="hover-name">${name}</div>` +
          `<div class="hover-count">${count}</div>` +
          hoverBars(rows) +
          changeLine
        );
      }

      function placeHover(x, y) {
        const card = document.getElementById("hoverCard");
        if (card.hidden) return;
        const pad = 14;
        const w = card.offsetWidth || 228;
        const h = card.offsetHeight || 120;
        let left = x + 18;
        let top = y + 16;
        if (left + w > window.innerWidth - pad) left = x - w - 12;
        if (top + h > window.innerHeight - pad) top = y - h - 12;
        card.style.transform = `translate(${Math.max(pad, left)}px, ${Math.max(pad, top)}px)`;
      }

      function showHover(html, x, y) {
        const card = document.getElementById("hoverCard");
        card.innerHTML = html;
        card.hidden = false;
        placeHover(x, y);
      }

      function hideHover() {
        document.getElementById("hoverCard").hidden = true;
      }

      // ------------------------------------------------------------- map drawing

      function clearChoropleth() {
        if (choroplethLayer) {
          map.removeLayer(choroplethLayer);
          choroplethLayer = null;
        }
      }

      function markerFor(p) {
        const lang = p.plotLang != null ? p.plotLang : displayLang(p) || p.primaryLang;
        const color = lang ? colorForLanguage(lang) : UNCLASSIFIED_COLOR;
        if (p.marker) {
          p.marker.setStyle({ color, fillColor: color });
          return p.marker;
        }
        const marker = L.circleMarker([p.lat, p.lon], {
          radius: 5,
          color,
          weight: 1.2,
          fillColor: color,
          fillOpacity: 0.75,
        });
        const href = /^https?:\/\//i.test(p.website) ? p.website : "";
        const link = href
          ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(href)}</a>`
          : escapeHtml(p.website) || "no website";
        // Bound as a function so the popup reflects the month currently selected
        // rather than whenever the marker happened to be created.
        marker.bindPopup(() => {
          const langLine = p.langs.length
            ? p.langs.map((l) => escapeHtml(titleCase(l))).join(" + ")
            : "No language detected";
          const history = p.hist
            ? "<br>" +
              p.hist
                .map(
                  (iv) =>
                    `<span style="color:${colorForLanguage(iv.primary)}">■</span> ` +
                    `${monthLabel(iv.from)}–${monthLabel(iv.to)}: ` +
                    `${escapeHtml(titleCase(iv.primary || "unknown"))}` +
                    (iv.landingPath ? ` <span style="color:#8a8375">${escapeHtml(iv.landingPath)}</span>` : ""),
                )
                .join("<br>")
            : "";
          return (
            `<b>${escapeHtml(p.name)}</b><br>${langLine}${history}<br>` +
            `${escapeHtml(p.rawCategory)}<br>${link}`
          );
        });
        p.marker = marker;
        return marker;
      }

      /**
       * Thin a bucket down to `take` points with an even stride, so what is
       * dropped is spread across the whole bucket instead of chopping off its
       * tail — which, with datasets concatenated in load order, would mean
       * dropping one region entirely.
       */
      function strideSample(bucket, take, out) {
        if (take >= bucket.length) {
          for (const p of bucket) out.push(p);
          return;
        }
        const stride = bucket.length / take;
        for (let i = 0; i < take; i++) out.push(bucket[Math.floor(i * stride)]);
      }

      /**
       * Fit the matching sites into MAX_MARKERS without letting one language
       * crowd out another. Smallest first: a rare language takes its full
       * bucket (it always fits in the even share), leftover slots are split
       * between the majority colours. Walking `points` in load order and
       * stopping at the cap used to drop Wales entirely once Quebec French
       * filled the budget.
       */
      function budgetMarkers(candidates) {
        if (candidates.length <= MAX_MARKERS) return candidates;
        const buckets = new Map();
        for (const p of candidates) {
          const key = p.plotLang || displayLang(p) || "";
          const bucket = buckets.get(key);
          if (bucket) bucket.push(p);
          else buckets.set(key, [p]);
        }
        const ordered = [...buckets.values()].sort((a, b) => a.length - b.length);
        const out = [];
        let left = MAX_MARKERS;
        let remaining = ordered.length;
        for (const bucket of ordered) {
          // max(1, …) so a pile of tiny languages cannot round the share to 0
          // and vanish. Last bucket always receives whatever is left.
          const share = remaining === 1 ? left : Math.max(1, Math.floor(left / remaining));
          const take = Math.min(bucket.length, share, left);
          strideSample(bucket, take, out);
          left -= take;
          remaining -= 1;
        }
        return out;
      }

      /** Majority first so minority dots paint on top instead of vanishing under them. */
      function sortMarkersMajorityUnderneath(markers) {
        const counts = new Map();
        for (const p of markers) {
          const key = p.plotLang || "";
          counts.set(key, (counts.get(key) || 0) + 1);
        }
        markers.sort((a, b) => {
          const ka = a.plotLang || "";
          const kb = b.plotLang || "";
          const d = (counts.get(kb) || 0) - (counts.get(ka) || 0);
          return d || ka.localeCompare(kb);
        });
      }

      function renderPoints() {
        markerLayer.clearLayers();
        const bounds = map.getBounds();
        const candidates = [];
        for (const p of points) {
          if (!datasetEnabled(p) || disabledCategories.has(p.category)) continue;
          const lang = p.langs.length ? displayLang(p) : showUnclassified ? "" : null;
          if (lang === null) continue;
          if (!bounds.contains([p.lat, p.lon])) continue;
          p.plotLang = lang;
          candidates.push(p);
        }
        const drawn = budgetMarkers(candidates);
        sortMarkersMajorityUnderneath(drawn);
        for (const p of drawn) markerLayer.addLayer(markerFor(p));
        return drawn.length;
      }

      function renderChoropleth() {
        clearChoropleth();
        hideHover();
        if (!authorityFeatures.length) return;
        const stats = authorityStats();
        choroplethLayer = L.geoJSON(
          { type: "FeatureCollection", features: authorityFeatures },
          {
            style(feature) {
              const fill = areaFill(stats.get(featureId(feature)));
              if (!fill) {
                return {
                  color: "#1a1814",
                  weight: 0.7,
                  fillColor: MISSING_FILL,
                  fillOpacity: 1,
                };
              }
              return {
                color: "#1a1814",
                weight: 0.7,
                fillColor:
                  mapMetric === "multilingual" || fill.lang == null
                    ? fill.color
                    : mixToLand(fill.color, Math.max(0.22, fill.intensity)),
                fillOpacity: 1,
              };
            },
            onEachFeature(feature, layer) {
              const rec = stats.get(featureId(feature));
              layer.on("mouseover", (e) => {
                layer.setStyle({ weight: 1.15, color: "#f3eee4" });
                layer.bringToFront();
                const ev = e.originalEvent;
                showHover(areaTooltip(feature, rec), ev.clientX, ev.clientY);
                prefetchChildren(feature);
              });
              layer.on("mousemove", (e) => {
                const ev = e.originalEvent;
                placeHover(ev.clientX, ev.clientY);
              });
              layer.on("mouseout", () => {
                choroplethLayer.resetStyle(layer);
                hideHover();
              });
              layer.on("click", () => {
                hideHover();
                if (viewingKind() === "subdivision_2") {
                  focusFeature(feature);
                  return;
                }
                drillInto(feature).catch((err) =>
                  showMapMessage(err.message || `Could not open ${feature.properties.name}.`),
                );
              });
            },
          },
        ).addTo(map);
      }

      function render() {
        areaStatsCache = null;
        const wasTimed = timeEnabled;
        syncTimeline();
